name: Valley paths
on:
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/valley-paths.yml']
  push:
    branches: [main, codex/valley-paths]
    paths: ['nushi-tsuri/**', '.github/workflows/valley-paths.yml']
permissions:
  contents: read
jobs:
  valley-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: bash install-ci-fonts.sh
      - run: node --test valley-paths-v252-31.test.cjs
      - run: node browser-valley-paths-v252-31.cjs
        env:
          VALLEY_EVIDENCE_DIR: valley-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: valley-evidence
          path: nushi-tsuri/tests/valley-evidence/
          if-no-files-found: warn
