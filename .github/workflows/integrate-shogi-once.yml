name: Integrate Shogi once

on:
  push:
    paths:
      - '.github/workflows/integrate-shogi-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Shogi to mini game menu
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_title = '<h2 class="section-title">ミニゲーム一覧 <span>7種プレイ可能</span></h2>'
          new_title = '<h2 class="section-title">ミニゲーム一覧 <span>8種プレイ可能</span></h2>'
          if old_title in text:
              text = text.replace(old_title, new_title, 1)
          elif new_title not in text:
              raise SystemExit('mini game count marker not found')

          chess = '<div class="mini-item"><button id="goChessGame" onclick="window.location.href=\'chess/index.html\'"><span class="mini-item-label"><img class="mini-item-icon" src="assets/icon-minigame-chess.svg" alt="" aria-hidden="true" decoding="async" draggable="false" /><span>犬小屋チェス</span></span><span class="mini-item-status">遊べる！</span></button></div>'
          shogi = '<div class="mini-item"><button id="goShogiGame" onclick="window.location.href=\'shogi/index.html\'"><span class="mini-item-label"><img class="mini-item-icon" src="assets/icon-minigame-shogi.svg" alt="" aria-hidden="true" decoding="async" draggable="false" /><span>犬小屋将棋</span></span><span class="mini-item-status">遊べる！</span></button></div>'
          if shogi not in text:
              if chess not in text:
                  raise SystemExit('chess menu marker not found')
              text = text.replace(chess, chess + '\n          ' + shogi, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/integrate-shogi-once.yml
          git commit -m "Add Inugoya Shogi to mini game menu"
          git push
