# Draft-PR validation on the authorized GitHub Actions runner.
# The local executor cannot launch Chromium; this workflow verifies the exact PR candidate before merge.
# No production deployment is performed by this workflow.
name: Village facility exterior routes
on:
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/village-refresh.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: village-refresh-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  facilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        width: [1280, 844, 820]
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Install existing pinned Japanese fonts
        run: bash install-ci-fonts.sh
      - name: Walk the facility fronts and existing entrances
        run: node browser-village-refresh-evidence.cjs ${{ matrix.width }} 2>&1 | tee village-refresh-browser.log
      - name: Preserve actual route and screen evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village-refresh-${{ matrix.width }}
          path: |
            nushi-tsuri/tests/browser-evidence-village-refresh/
            nushi-tsuri/tests/village-refresh-browser.log
          retention-days: 14
          if-no-files-found: warn
