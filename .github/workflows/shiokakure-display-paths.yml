name: Shiokakure display and island paths
on:
  push:
    branches: [fix/shiokakure-display-island-paths]
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/shiokakure-display-paths.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shiokakure-display-paths-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: bash install-ci-fonts.sh
      - run: node --test shiokakure-display-paths.test.cjs offshore-shelter-verge.test.cjs offshore-open-ground-v252-19.test.cjs offshore-collision-v252-16.test.cjs release-version.test.cjs village-release-provenance.test.cjs
      - name: Independently inspect display and movement even when a unit guard fails
        if: always()
        run: node browser-shiokakure-display-paths.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: shiokakure-display-paths
          path: nushi-tsuri/tests/artifacts/shiokakure-display-paths/
          retention-days: 14
