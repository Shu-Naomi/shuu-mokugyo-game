name: Island fish catch and aquarium
on:
  push:
    branches: [main, codex/island-fish-v252-56]
    paths: ['nushi-tsuri/**', '.github/workflows/island-fish.yml']
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/island-fish.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: island-fish-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  island-fish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: bash install-ci-fonts.sh
      - name: Verify Island fish encounters, atlas, records, boarding and old saves
        run: node --test --test-concurrency=2 island-fish-v252-56.test.cjs
      - name: Play both modes with largest fish and 600ms reactions
        run: |
          node browser-island-fish-evidence.cjs
          ISLAND_FISH_WIDTH=844 ISLAND_FISH_HEIGHT=390 ISLAND_FISH_TOUCH=1 node browser-island-fish-evidence.cjs
        env:
          NUSHI_PUBLIC_GAMEPLAY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
      - name: Preserve screenshots, native clips and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: island-fish-evidence
          path: |
            nushi-tsuri/tests/browser-evidence-island-fish/
          retention-days: 14
          if-no-files-found: warn
