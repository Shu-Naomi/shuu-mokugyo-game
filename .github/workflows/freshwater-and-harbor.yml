name: Freshwater and harbor fish
on:
  pull_request:
    branches: [main, fish/hoshikagami-marsh-review, draft/canal-crustaceans-regional-water]
    paths: ['nushi-tsuri/**', '.github/workflows/freshwater-and-harbor.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freshwater-and-harbor-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  five-species:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: bash install-ci-fonts.sh
      - name: Check actual catches in both fishing modes and old records
        run: node --test freshwater-and-harbor.test.cjs canal-crustaceans.test.cjs regional-underwater.test.cjs cast-water-v222.test.cjs coast-fishing-v195.test.cjs
      - name: Play and photograph five new fish on a landscape phone
        run: node browser-freshwater-and-harbor.cjs
      - name: Check regional water and idle surf on landscape phone
        env:
          REGIONAL_WATER_EVIDENCE: freshwater-and-harbor-evidence/regional-water
        run: node browser-regional-underwater.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: freshwater-and-harbor-fish
          path: nushi-tsuri/tests/freshwater-and-harbor-evidence/
          retention-days: 14
