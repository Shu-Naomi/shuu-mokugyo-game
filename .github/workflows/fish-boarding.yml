name: Fish boarding
on:
  push:
    branches: [main, codex/fish-boarding-v252-27]
    paths:
      - 'nushi-tsuri/index.html'
      - 'nushi-tsuri/pet-life*'
      - 'nushi-tsuri/pet-notebook.js'
      - 'nushi-tsuri/aquarium-*.js'
      - 'nushi-tsuri/save-slots.js'
      - 'nushi-tsuri/sw.js'
      - 'nushi-tsuri/tests/*boarding*'
      - 'nushi-tsuri/tests/game-harness.cjs'
      - 'nushi-tsuri/tests/install-ci-fonts.sh'
      - '.github/workflows/fish-boarding.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nushi-tsuri/index.html'
      - 'nushi-tsuri/pet-life*'
      - 'nushi-tsuri/pet-notebook.js'
      - 'nushi-tsuri/aquarium-*.js'
      - 'nushi-tsuri/save-slots.js'
      - 'nushi-tsuri/sw.js'
      - 'nushi-tsuri/tests/*boarding*'
      - 'nushi-tsuri/tests/game-harness.cjs'
      - 'nushi-tsuri/tests/install-ci-fonts.sh'
      - '.github/workflows/fish-boarding.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fish-boarding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set ownership of this container checkout
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - name: Install pinned Japanese Noto fonts
        run: bash install-ci-fonts.sh
      - name: Check reversible boarding and retained aquarium behavior
        run: node --test --test-concurrency=2 *boarding*.test.cjs pet-notebook.test.cjs aquarium-mutations-v251-8.test.cjs aquarium-breeding-v188.test.cjs aquarium-identity-v251-7.test.cjs aquarium-growth-v230.test.cjs pet-life-integration.test.cjs service-worker.test.cjs
      - name: Exercise boarding on desktop and two landscape phones
        run: node browser-fish-boarding-v252-27.cjs
      - name: Verify the published game matches this merged checkout
        if: ${{ github.ref == 'refs/heads/main' }}
        run: node fish-boarding-public-source-v252-27.cjs
      - name: Exercise published boarding after the source match
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          FISH_BOARDING_PUBLIC_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/?v=252-27
          FISH_BOARDING_EVIDENCE_DIR: fish-boarding-evidence/public
        run: node browser-fish-boarding-v252-27.cjs
      - name: Preserve fish boarding evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fish-boarding-evidence
          path: nushi-tsuri/tests/fish-boarding-evidence/
          retention-days: 14
          if-no-files-found: warn
