name: Underwater fight motion
on:
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/fight-motion.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fight-motion-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: bash install-ci-fonts.sh
      - name: Preserve balance, original anatomy, pause and bounded painter allocations
        run: node --test --test-concurrency=2 fight-motion.test.cjs fish-resistance-v244.test.cjs fish-motion-v213.test.cjs fish-render-transitions.test.cjs fishing-spec-v242.test.cjs render-efficiency.test.cjs
      - name: Capture the exact unchanged comparison runtime
        run: |
          git fetch --depth=1 origin f45b14d49e4d7f2ad88bb4fcbf5a3d3891408845
          git worktree add /tmp/fight-motion-baseline f45b14d49e4d7f2ad88bb4fcbf5a3d3891408845
          MOTION_ROOT=/tmp/fight-motion-baseline/nushi-tsuri MOTION_OUT=fight-motion-evidence/before node browser-fight-motion.cjs
      - name: Capture stronger strokes, warning cues, pauses and reduced motion
        run: MOTION_ENHANCED=1 MOTION_OUT=fight-motion-evidence/after node browser-fight-motion.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fight-motion-evidence
          path: nushi-tsuri/tests/fight-motion-evidence/
          retention-days: 14
