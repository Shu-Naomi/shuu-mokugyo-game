name: Nushi regression
on:
  push:
    branches: [main, codex/v202-mountain-nushi-recovery, codex/v203-stream-collision, codex/v204-real-instrument-arrangements, codex/v205-masters-heavy-rock, codex/v206-lake-story, codex/v210-dog-care-clean]
    paths:
      - 'nushi-tsuri/**'
      - '.github/workflows/nushi-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nushi-tsuri/**'
      - '.github/workflows/nushi-regression.yml'
permissions:
  contents: read
concurrency:
  group: nushi-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install audio decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install --no-audit --no-fund
      - run: node --test --test-concurrency=2 *.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node browser-v202.smoke.cjs
        env:
          NUSHI_PUBLIC_SMOKE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
