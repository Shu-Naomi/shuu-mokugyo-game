name: Nushi regression
on:
  push:
    branches: [main, codex/v202-mountain-nushi-recovery]
    paths:
      - 'nushi-tsuri/**'
      - '.github/workflows/nushi-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nushi-tsuri/**'
      - '.github/workflows/nushi-regression.yml'
permissions:
  contents: read
concurrency:
  group: nushi-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install audio decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install --no-audit --no-fund
      - run: node --test --test-concurrency=2 *.test.cjs
