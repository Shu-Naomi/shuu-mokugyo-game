name: Rural canals
on:
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/rural-canals.yml']
  push:
    branches: [main, codex/rural-canal-playable]
    paths: ['nushi-tsuri/**', '.github/workflows/rural-canals.yml']
permissions:
  contents: read
jobs:
  rural-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: bash install-ci-fonts.sh
      - run: node --test rural-canals.test.cjs mountain-coast-v201.test.cjs mountain-paths-v236.test.cjs release-version.test.cjs
      - run: node browser-rural-canals.cjs
        env:
          RURAL_EVIDENCE_DIR: rural-evidence
      - name: Check out the shipped v252-85 browser client
        if: github.event.pull_request.number == 374 || github.head_ref == 'fix/offline-map-media'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 12df756d184120a59d4d6c78d39356d0a0612e73
          path: .previous-map-release
          sparse-checkout: nushi-tsuri
          persist-credentials: false
      - name: Check out the first shipped v252-92 worker
        if: github.head_ref == 'fix/offline-map-media'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: d7698aba144e9cae4953bb4fdf1b02f88e3ac4a8
          path: .first-map-release
          sparse-checkout: nushi-tsuri
          persist-credentials: false
      - name: Verify v252-92 installation, upgrade, and failure recovery
        if: github.event.pull_request.number == 374 || github.head_ref == 'fix/offline-map-media'
        run: |
          mkdir -p rural-evidence
          failed=0
          for scenario in fresh success corrupt quota; do
            MAP_UPDATE_REPORT="rural-evidence/update-$scenario.json" \
              node browser-map-update.cjs "$GITHUB_WORKSPACE/.previous-map-release/nushi-tsuri" "$scenario" || failed=1
          done
          if [[ -d "$GITHUB_WORKSPACE/.first-map-release/nushi-tsuri" ]]; then
            MAP_UPDATE_REPORT="rural-evidence/update-installed-v92.json" \
              node browser-map-update.cjs "$GITHUB_WORKSPACE/.first-map-release/nushi-tsuri" success || failed=1
          fi
          exit "$failed"
      - name: Verify deployed sources and public gameplay
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node rural-canals-public-source.cjs
          node browser-rural-canals.cjs
        env:
          RURAL_BASE_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/
          RURAL_EVIDENCE_DIR: rural-evidence/public
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rural-evidence
          path: nushi-tsuri/tests/rural-evidence/
          if-no-files-found: warn
