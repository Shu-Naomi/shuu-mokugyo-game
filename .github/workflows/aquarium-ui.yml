name: Aquarium UI
on:
  push:
    branches: [main, codex/v231-aquarium-ui]
    paths:
      - 'nushi-tsuri/index.html'
      - 'nushi-tsuri/pet-life*.js'
      - 'nushi-tsuri/pet-life.css'
      - 'nushi-tsuri/aquarium-life.js'
      - 'nushi-tsuri/tests/browser*aquarium*.cjs'
      - '.github/workflows/aquarium-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nushi-tsuri/index.html'
      - 'nushi-tsuri/pet-life*.js'
      - 'nushi-tsuri/pet-life.css'
      - 'nushi-tsuri/aquarium-life.js'
      - 'nushi-tsuri/tests/browser*aquarium*.cjs'
      - '.github/workflows/aquarium-ui.yml'
permissions:
  contents: read
concurrency:
  group: aquarium-ui-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: node browser-aquarium-ui-evidence.cjs
      - name: Upload aquarium screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aquarium-ui-screens
          path: nushi-tsuri/tests/browser-evidence-v231/
          retention-days: 14
          if-no-files-found: warn
