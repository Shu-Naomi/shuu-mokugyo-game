name: Offshore ferry and island fish
on:
  push:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/offshore-island.yml']
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/offshore-island.yml']
permissions:
  contents: read
concurrency:
  group: offshore-island-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  voyage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        screen:
          - {width: 1280, height: 720, touch: '0', dpr: 1}
          - {width: 844, height: 390, touch: '1', dpr: 1}
          - {width: 820, height: 366, touch: '1', dpr: 1.875}
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: node browser-v251-evidence.cjs
        env:
          V251_WIDTH: ${{ matrix.screen.width }}
          V251_HEIGHT: ${{ matrix.screen.height }}
          V251_TOUCH: ${{ matrix.screen.touch }}
          V251_DPR: ${{ matrix.screen.dpr }}
          NUSHI_PUBLIC_GAMEPLAY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
      - name: Upload island voyage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v251-island-${{ matrix.screen.width }}
          path: nushi-tsuri/tests/browser-evidence-v251/
          retention-days: 14
          if-no-files-found: warn
