name: Timed rest
on:
  push:
    branches: [feat/lakeside-timed-rest]
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/timed-rest.yml']
concurrency:
  group: timed-rest-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rest-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: bash install-ci-fonts.sh
      - run: node --test --test-concurrency=2 timed-rest.test.cjs service-worker.test.cjs village-inn-redesign.test.cjs pet-life-integration.test.cjs
      - run: node browser-timed-rest.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: timed-rest-evidence
          path: nushi-tsuri/tests/opening-review/rest/
          retention-days: 14
