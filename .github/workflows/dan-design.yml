name: Dan shop and race design
on:
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/dan-design.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dan-design-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: bash install-ci-fonts.sh
      - name: Race rules and saved fish remain unchanged
        run: node --test dan-design.test.cjs village-fish-games.test.cjs pet-boarding.test.cjs release-version.test.cjs village-release-provenance.test.cjs
      - name: Same-save before and after at desktop and short landscape sizes
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach /tmp/dan-before 12df756d184120a59d4d6c78d39356d0a0612e73
          DAN_BASELINE=/tmp/dan-before/nushi-tsuri node browser-dan-design.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dan-design-before-after
          path: nushi-tsuri/tests/artifacts/dan-design/
          retention-days: 14
