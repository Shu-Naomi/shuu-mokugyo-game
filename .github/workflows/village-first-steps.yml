name: Village first steps and safe fishing
on:
  push:
    branches: [main, codex/village-first-steps]
    paths:
      - 'nushi-tsuri/index.html'
      - 'nushi-tsuri/village-guide.*'
      - 'nushi-tsuri/field-guide.*'
      - 'nushi-tsuri/sw.js'
      - 'nushi-tsuri/tests/*village-first-steps*'
      - 'nushi-tsuri/tests/*cast-cancel*'
      - 'nushi-tsuri/tests/opening-story-public-source.cjs'
      - 'nushi-tsuri/tests/browser-start-adventure.cjs'
      - 'nushi-tsuri/tests/game-harness.cjs'
      - 'nushi-tsuri/tests/install-ci-fonts.sh'
      - '.github/workflows/village-first-steps.yml'
  workflow_dispatch:
    inputs:
      public_url:
        description: Optional published URL for the same route and fishing checks
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: village-first-steps-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  village:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set ownership of this container checkout
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - name: Install pinned Japanese Noto fonts
        run: bash install-ci-fonts.sh
      - name: Check optional progress, compatibility, home, opening and both fishing modes
        if: ${{ !inputs.public_url }}
        run: node --test --test-concurrency=2 village-first-steps.test.cjs field-guide-v239.test.cjs opening-story-v252-2.test.cjs opening-presentation-271.test.cjs cast-cancel-269.test.cjs home-dogs.test.cjs service-worker.test.cjs 2>&1 | tee village-guide-unit.log
      - name: Walk from the opening through the existing village on three screens
        env:
          VILLAGE_GUIDE_PUBLIC_URL: ${{ inputs.public_url }}
        run: node browser-village-first-steps-evidence.cjs 2>&1 | tee village-guide-browser.log
      - name: Protect empty bait, usable lures and field return on three screens
        env:
          CAST_CANCEL_PUBLIC_URL: ${{ inputs.public_url }}
        run: node browser-cast-cancel-evidence.cjs 2>&1 | tee village-guide-cast-cancel.log
      - name: Wait for Pages to match this merged source
        if: ${{ github.ref == 'refs/heads/main' && !inputs.public_url }}
        run: node opening-story-public-source.cjs 2>&1 | tee village-guide-public-source.log
      - name: Walk the published village on three screens
        if: ${{ github.ref == 'refs/heads/main' && !inputs.public_url }}
        env:
          VILLAGE_GUIDE_PUBLIC_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/?v=252-5
        run: node browser-village-first-steps-evidence.cjs 2>&1 | tee village-guide-public-browser.log
      - name: Check published empty bait and lure controls
        if: ${{ github.ref == 'refs/heads/main' && !inputs.public_url }}
        env:
          CAST_CANCEL_PUBLIC_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/?v=252-5
        run: node browser-cast-cancel-evidence.cjs 2>&1 | tee village-guide-public-cast-cancel.log
      - name: Preserve route, touch and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village-first-steps-evidence
          path: |
            nushi-tsuri/tests/village-guide-*.log
            nushi-tsuri/tests/village-guide-evidence/
            nushi-tsuri/tests/cast-cancel-evidence/
            nushi-tsuri/tests/opening-story-evidence/public-source.json
          retention-days: 14
          if-no-files-found: warn
