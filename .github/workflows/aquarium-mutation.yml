name: Aquarium colours and notebook
on:
  push:
    branches: [main, codex/funa-gold-mutation-v251-8, codex/koi-gold-mutation, codex/pet-notebook, codex/fish-nicknames-v252-11, codex/namazu-albino-v252-12, codex/medaka-gold-v252-13, codex/unagi-albino-v252-14, codex/dojo-albino-v252-15, codex/offshore-collision-v252-16, codex/offshore-ground-boundaries-v252-17]
    paths:
      - 'nushi-tsuri/index.html'
      - 'nushi-tsuri/pet-life-ui.js'
      - 'nushi-tsuri/aquarium-mutations.js'
      - 'nushi-tsuri/pet-life.js'
      - 'nushi-tsuri/pet-notebook.js'
      - 'nushi-tsuri/aquarium-life.js'
      - 'nushi-tsuri/fish-art.js'
      - 'nushi-tsuri/assets/aquarium-funa-gold-v251-8.png'
      - 'nushi-tsuri/assets/aquarium-koi-gold-v252-9.png'
      - 'nushi-tsuri/assets/aquarium-namazu-albino-v252-12.png'
      - 'nushi-tsuri/assets/aquarium-medaka-gold-v252-13.png'
      - 'nushi-tsuri/assets/aquarium-unagi-albino-v252-14.png'
      - 'nushi-tsuri/assets/aquarium-dojo-albino-v252-15.png'
      - 'nushi-tsuri/pet-life.css'
      - 'nushi-tsuri/sw.js'
      - 'nushi-tsuri/tests/*aquarium-mutation*'
      - 'nushi-tsuri/tests/*pet-notebook*'
      - 'nushi-tsuri/tests/*pet-nicknames*'
      - '.github/workflows/aquarium-mutation.yml'
  workflow_dispatch:
    inputs:
      public_url:
        description: Optional published game URL for the same focused interaction checks
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: aquarium-mutation-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set ownership of this container checkout
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - name: Install pinned Japanese Noto fonts
        run: |
          mkdir -p /usr/local/share/fonts/noto-ci
          cd /usr/local/share/fonts/noto-ci
          curl --fail --location --connect-timeout 10 --max-time 60 --retry 2 --output NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          curl --fail --location --connect-timeout 10 --max-time 60 --retry 2 --output NotoSansCJKjp-Bold.otf https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Japanese/NotoSansCJKjp-Bold.otf
          sha256sum --check <<'FONT_HASHES'
          68a3fc98800b2a27b371f2fb79991daf3633bd89309d4ffaa6946fd587f375b5  NotoSansCJKjp-Regular.otf
          e53dcb0dcb2922e45d01aae1ebd2f382bb81d4229b18b6b883bd170678af1f76  NotoSansCJKjp-Bold.otf
          FONT_HASHES
          cat > /etc/fonts/conf.d/99-nushi-japanese.conf <<'FONT_CONFIG'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
          </fontconfig>
          FONT_CONFIG
          fc-cache -f
          fc-scan --format '%{family}\n' /usr/local/share/fonts/noto-ci/NotoSansCJKjp-Regular.otf | grep -F 'Noto Sans CJK JP'
          fc-match -f '%{family}\n' 'sans-serif:lang=ja'
          fc-match -f '%{family}\n' 'Noto Sans CJK JP' | grep -F 'Noto Sans CJK JP'
      - name: Check draw boundaries, save compatibility and unchanged aquarium behavior
        if: ${{ !inputs.public_url }}
        run: node --test --test-concurrency=2 aquarium-mutations-v251-8.test.cjs aquarium-mutations-koi.test.cjs aquarium-mutations-namazu.test.cjs aquarium-mutations-medaka.test.cjs aquarium-mutations-unagi.test.cjs aquarium-mutations-dojo.test.cjs pet-notebook.test.cjs pet-nicknames.test.cjs aquarium-mutation-render.test.cjs aquarium-identity-v251-7.test.cjs aquarium-ui-v231.test.cjs aquarium-breeding-v188.test.cjs aquarium-growth-v230.test.cjs aquarium-inspection-v190.test.cjs buri-growth-v249.test.cjs pet-life-integration.test.cjs service-worker.test.cjs 2>&1 | tee aquarium-mutation-unit.log
      - name: Exercise golden and albino hatching, discovery, care, growth, moving and resume on three screens
        env:
          AQUARIUM_MUTATION_PUBLIC_URL: ${{ inputs.public_url }}
        run: node browser-aquarium-mutation-evidence.cjs 2>&1 | tee aquarium-mutation-browser.log
      - name: Exercise notebook gift, fish nicknames, old saves and retained pages on three screens
        env:
          PET_NOTEBOOK_PUBLIC_URL: ${{ inputs.public_url }}
        run: node browser-pet-notebook-evidence.cjs 2>&1 | tee pet-notebook-browser.log
      - name: Wait for the published runtime to match the merged source
        if: ${{ github.ref == 'refs/heads/main' && !inputs.public_url }}
        run: node aquarium-mutation-public-source.cjs 2>&1 | tee aquarium-mutation-public-source.log
      - name: Exercise the published aquarium on all six rare fish on the same three screens
        if: ${{ github.ref == 'refs/heads/main' && !inputs.public_url }}
        env:
          AQUARIUM_MUTATION_PUBLIC_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/?v=252-17
        run: node browser-aquarium-mutation-evidence.cjs 2>&1 | tee aquarium-mutation-public-browser.log
      - name: Exercise the published notebook and fish nicknames on three screens
        if: ${{ github.ref == 'refs/heads/main' && !inputs.public_url }}
        env:
          PET_NOTEBOOK_PUBLIC_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/?v=252-17
        run: node browser-pet-notebook-evidence.cjs 2>&1 | tee pet-notebook-public-browser.log
      - name: Preserve focused browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aquarium-mutation-evidence
          path: |
            nushi-tsuri/tests/aquarium-mutation-*.log
            nushi-tsuri/tests/aquarium-mutation-evidence/
            nushi-tsuri/tests/pet-notebook-*.log
            nushi-tsuri/tests/pet-notebook-evidence/
          retention-days: 14
          if-no-files-found: warn
