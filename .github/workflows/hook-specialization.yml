name: Hook selection and specialization
on:
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/hook-specialization.yml']
  push:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/hook-specialization.yml']
concurrency:
  group: hook-specialization-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  hook-specialization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: bash install-ci-fonts.sh
      - run: node --test hook-purchases.test.cjs hook-specialization.test.cjs tackle-balance-v191.test.cjs
      - run: node browser-hook-purchases.cjs
        env:
          HOOK_PURCHASES_EVIDENCE_DIR: hook-specialization-evidence/purchases
      - run: node browser-hook-specialization.cjs
        env:
          HOOK_SPECIALIZATION_EVIDENCE_DIR: hook-specialization-evidence
      - name: Verify deployed sources and public hook gameplay
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node hook-specialization-public-source.cjs
          node browser-hook-specialization.cjs
          node browser-hook-purchases.cjs
        env:
          HOOK_SPECIALIZATION_BASE_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/
          HOOK_SPECIALIZATION_EVIDENCE_DIR: hook-specialization-evidence/public
          HOOK_PURCHASES_BASE_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/
          HOOK_PURCHASES_EVIDENCE_DIR: hook-specialization-evidence/public-purchases
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hook-specialization-evidence
          path: nushi-tsuri/tests/hook-specialization-evidence/
          if-no-files-found: warn
