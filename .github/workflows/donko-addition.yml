name: Donko catch and aquarium
on:
  push:
    branches: [main, codex/donko-v252-47]
    paths: ['nushi-tsuri/**', '.github/workflows/donko-addition.yml']
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/donko-addition.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: donko-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  donko:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: bash install-ci-fonts.sh
      - name: Verify Donko encounters, atlas, records, boarding and old saves
        run: node --test --test-concurrency=2 donko-v252-47.test.cjs
      - name: Play both fight styles and inspect the aquarium on desktop and touch
        run: node browser-donko-v252-47.cjs
      - name: Wait for matching deployed source and original atlas
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node donko-public-source-v252-47.cjs
      - name: Play the published game
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node browser-donko-v252-47.cjs
        env:
          DONKO_PUBLIC_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/
          DONKO_EVIDENCE_DIR: public-donko-evidence
      - name: Preserve screenshots, native clips and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: donko-evidence
          path: |
            nushi-tsuri/tests/donko-evidence/
            nushi-tsuri/tests/public-donko-evidence/
          retention-days: 14
          if-no-files-found: warn
