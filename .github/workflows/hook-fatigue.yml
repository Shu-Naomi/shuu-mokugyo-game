name: Hook wear and species endurance
on:
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/hook-fatigue.yml']
  push:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/hook-fatigue.yml']
concurrency:
  group: hook-fatigue-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  hook-fatigue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: bash install-ci-fonts.sh
      - run: node --test hook-fatigue-v252-32.test.cjs nushi-playability-v228.test.cjs
      - run: node browser-hook-fatigue-v252-32.cjs
        env:
          HOOK_EVIDENCE_DIR: hook-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hook-evidence
          path: nushi-tsuri/tests/hook-evidence/
          if-no-files-found: warn
