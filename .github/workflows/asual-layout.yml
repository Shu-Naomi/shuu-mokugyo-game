name: Asual shop layout
on:
  pull_request:
    branches: [main]
    paths:
      - 'nushi-tsuri/pet-life*'
      - 'nushi-tsuri/compact-ui.*'
      - 'nushi-tsuri/tests/*asual*'
      - '.github/workflows/asual-layout.yml'
permissions:
  contents: read
concurrency:
  group: asual-layout-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  evidence:
    if: github.head_ref == 'codex/fix-asual-shop-dialogue'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    env:
      NUSHI_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      NUSHI_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: bash install-ci-fonts.sh
      - run: node browser-asual-layout-evidence.cjs
      - name: Preserve screenshots and geometry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: asual-layout-${{ github.event.pull_request.head.sha }}
          path: nushi-tsuri/tests/browser-evidence-asual-layout/
          retention-days: 14
          if-no-files-found: warn
