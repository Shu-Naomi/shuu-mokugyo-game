name: Sam pixel-art pilot comparison
on:
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/sam-pixel-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sam-pixel-pilot-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        screen:
          - {width: 1280, height: 720, touch: '0', dpr: 1}
          - {width: 844, height: 390, touch: '1', dpr: 1}
          - {width: 820, height: 366, touch: '1', dpr: 1.875}
    defaults:
      run:
        working-directory: current/nushi-tsuri/tests
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: current
      - name: Check out immutable before image
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 880817ec738f6f9dcc45dc9a3a098e7bd6676823
          path: baseline
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: bash install-ci-fonts.sh
      - name: Compare identical scenes and collect native-clock idle proxy
        run: node browser-sam-pixel-pilot-evidence.cjs
        env:
          SAM_BASELINE_ROOT: ${{ github.workspace }}/baseline
          SAM_WIDTH: ${{ matrix.screen.width }}
          SAM_HEIGHT: ${{ matrix.screen.height }}
          SAM_TOUCH: ${{ matrix.screen.touch }}
          SAM_DPR: ${{ matrix.screen.dpr }}
      - name: Existing route and shop regression
        if: ${{ !cancelled() }}
        run: node browser-village-sam-evidence.cjs
        env:
          SAM_WIDTH: ${{ matrix.screen.width }}
          SAM_HEIGHT: ${{ matrix.screen.height }}
          SAM_TOUCH: ${{ matrix.screen.touch }}
          SAM_DPR: ${{ matrix.screen.dpr }}
      - name: Preserve before-after review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sam-pixel-pilot-${{ matrix.screen.width }}-dpr${{ matrix.screen.dpr }}
          path: |
            current/nushi-tsuri/tests/browser-evidence-sam-pixel-pilot/
            current/nushi-tsuri/tests/browser-evidence-village-sam/
          retention-days: 30
          if-no-files-found: warn
