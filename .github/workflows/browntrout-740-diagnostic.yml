name: Brown trout 740 diagnostic
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/browntrout-740-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: browntrout-740-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: bash install-ci-fonts.sh
      - name: Verify published gameplay matches this checkout
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert/strict');
          (async()=>{for(const name of ['index.html','fishing-duel.js','fish-additions.js']){
            const url='https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/'+name+'?brown-diagnostic='+Date.now();
            const r=await fetch(url);assert.equal(r.status,200);const data=Buffer.from(await r.arrayBuffer());
            const local=fs.readFileSync('../'+name),sha=b=>crypto.createHash('sha256').update(b).digest('hex');
            console.log(JSON.stringify({name,local:sha(local),published:sha(data)}));assert.equal(sha(data),sha(local),'published source differs: '+name);
          }})().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Preserve exact source and run only the reported screen
        env:
          BROWN_TROUT_PUBLIC_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/
        run: |
          git rev-parse HEAD
          sha256sum browser-browntrout.cjs ../../nushi-tsuri/fishing-duel.js
          node <<'NODE'
          const fs=require('fs'),Module=require('module'),path=require('path');
          const p=path.resolve('browser-browntrout.cjs');
          const original=fs.readFileSync(p,'utf8');
          const screens='[{width:1280,height:720},{width:844,height:390},{width:740,height:360}]';
          if(!original.includes(screens))throw Error('Screen selector changed; inspect before retrying');
          const source=original.replace(screens,'[{width:740,height:360}]');
          // The game, encounter, input, reaction delay and 216s assertion are unchanged.
          const m=new Module(p,module);m.filename=p;m.paths=Module._nodeModulePaths(path.dirname(p));m._compile(source,p);
          NODE
      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browntrout-740-baseline
          path: nushi-tsuri/tests/browntrout-evidence/
          retention-days: 14
          if-no-files-found: warn
