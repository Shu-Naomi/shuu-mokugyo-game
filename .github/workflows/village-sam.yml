name: Village Sam shop and paths
on:
  push:
    branches: [main, codex/village-sam-first]
    paths: ['nushi-tsuri/**', '.github/workflows/village-sam.yml']
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/village-sam.yml']
permissions:
  contents: read
concurrency:
  group: village-sam-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  district:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        screen:
          - {width: 1280, height: 720, touch: '0', dpr: 1}
          - {width: 844, height: 390, touch: '1', dpr: 1}
          - {width: 820, height: 366, touch: '1', dpr: 1.875}
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: node browser-village-sam-evidence.cjs
        env:
          SAM_WIDTH: ${{ matrix.screen.width }}
          SAM_HEIGHT: ${{ matrix.screen.height }}
          SAM_TOUCH: ${{ matrix.screen.touch }}
          SAM_DPR: ${{ matrix.screen.dpr }}
      - name: Preserve shop and path screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village-sam-${{ matrix.screen.width }}
          path: nushi-tsuri/tests/browser-evidence-village-sam/
          retention-days: 14
          if-no-files-found: warn
