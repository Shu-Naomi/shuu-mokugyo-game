name: Rendering efficiency
on:
  push:
    branches: [main, codex/mobile-render-efficiency-v252-29]
    paths:
      - 'nushi-tsuri/index.html'
      - 'nushi-tsuri/layered-scenery.js'
      - 'nushi-tsuri/scenery-worker.js'
      - 'nushi-tsuri/scene-layers.js'
      - 'nushi-tsuri/fish-art.js'
      - 'nushi-tsuri/aquarium-life.js'
      - 'nushi-tsuri/tests/*render-efficiency*'
      - 'nushi-tsuri/tests/game-harness.cjs'
      - 'nushi-tsuri/tests/browser-start-adventure.cjs'
      - 'nushi-tsuri/tests/install-ci-fonts.sh'
      - '.github/workflows/render-efficiency.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nushi-tsuri/index.html'
      - 'nushi-tsuri/layered-scenery.js'
      - 'nushi-tsuri/scenery-worker.js'
      - 'nushi-tsuri/scene-layers.js'
      - 'nushi-tsuri/fish-art.js'
      - 'nushi-tsuri/aquarium-life.js'
      - 'nushi-tsuri/tests/*render-efficiency*'
      - 'nushi-tsuri/tests/game-harness.cjs'
      - 'nushi-tsuri/tests/browser-start-adventure.cjs'
      - 'nushi-tsuri/tests/install-ci-fonts.sh'
      - '.github/workflows/render-efficiency.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-efficiency-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: nushi-tsuri/tests
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set ownership of this container checkout
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - name: Install pinned Japanese Noto fonts
        run: bash install-ci-fonts.sh
      - name: Check paint budgets, hidden/resume, cache reuse and retained animation behavior
        run: node --test --test-concurrency=2 render-efficiency.test.cjs home-dogs.test.cjs fish-render-transitions.test.cjs dog-care-petting-v211.test.cjs aquarium-growth-v230.test.cjs layered-scenery.test.cjs
      - name: Exercise real rendering on desktop and landscape phone DPR 3
        run: node browser-render-efficiency.cjs
      - name: Preserve rendering measurements and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: render-efficiency-evidence
          path: nushi-tsuri/tests/render-efficiency-evidence/
          retention-days: 14
          if-no-files-found: warn
