name: Living waters and grounded casts
on:
  push:
    branches: [main, codex/v238-living-waters]
    paths: ['nushi-tsuri/**', '.github/workflows/living-waters.yml']
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/living-waters.yml']
permissions:
  contents: read
concurrency:
  group: living-waters-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: node browser-life-ui-evidence.cjs
      - run: node browser-shore-ui-evidence.cjs
      - run: node browser-inventory-ui-evidence.cjs
      - name: Upload walking, interiors and cast screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: living-waters-screens
          path: |
            nushi-tsuri/tests/browser-evidence-v238/
            nushi-tsuri/tests/browser-evidence-v245/
            nushi-tsuri/tests/browser-evidence-v246/
            nushi-tsuri/tests/browser-evidence-v247/
            nushi-tsuri/tests/browser-evidence-v248/
          retention-days: 14
          if-no-files-found: warn
