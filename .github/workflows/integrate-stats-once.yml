name: Integrate minigame ledger once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install shared ledger hooks
        run: python3 scripts/integrate_stats_ledger.py

      - name: Check JavaScript syntax
        run: |
          node --check assets/inugoya-stats.js
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          paths = [
              'index.html',
              'othello/index.html',
              'chess/index.html',
              'shogi/index.html',
          ]
          for html_path in paths:
              html = Path(html_path).read_text(encoding='utf-8')
              scripts = re.findall(
                  r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',
                  html,
                  flags=re.S | re.I,
              )
              for script in scripts:
                  with tempfile.NamedTemporaryFile(
                      'w', suffix='.js', encoding='utf-8', delete=False
                  ) as handle:
                      handle.write(script)
                      temp_name = handle.name
                  subprocess.run(['node', '--check', temp_name], check=True)
              print(f'{html_path}: {len(scripts)} inline script(s) OK')
          PY

      - name: Commit integration and remove one-time tools
        run: |
          rm -f .github/workflows/integrate-stats-once.yml
          rm -f scripts/integrate_stats_ledger.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git commit -m "Integrate shared minigame ledger"
          git push origin main
