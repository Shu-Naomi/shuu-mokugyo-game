name: Marsh retreat
on:
  pull_request:
    branches: [main]
    paths: ['nushi-tsuri/**', '.github/workflows/marsh-retreat.yml']
  push:
    branches: [main, codex/marsh-bridge-retreat]
    paths: ['nushi-tsuri/**', '.github/workflows/marsh-retreat.yml']
permissions:
  contents: read
jobs:
  marsh-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nushi-tsuri/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: bash install-ci-fonts.sh
      - run: node --test marsh-retreat.test.cjs marsh-paths-fish-v237.test.cjs mountain-coast-v201.test.cjs mountain-paths-v236.test.cjs release-version.test.cjs
      - run: node browser-marsh-retreat.cjs
        env:
          MARSH_EVIDENCE_DIR: marsh-evidence
      - name: Verify deployed sources and public gameplay
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node marsh-retreat-public-source.cjs
          node browser-marsh-retreat.cjs
        env:
          MARSH_BASE_URL: https://shu-naomi.github.io/shuu-mokugyo-game/nushi-tsuri/
          MARSH_EVIDENCE_DIR: marsh-evidence/public
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: marsh-evidence
          path: nushi-tsuri/tests/marsh-evidence/
          if-no-files-found: warn
