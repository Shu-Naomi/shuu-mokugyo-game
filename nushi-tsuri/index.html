<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#10283a" />
    <title>ぬし釣り犬小屋・星降る湖</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        --ink: #172a35;
        --cream: #fff1c7;
        --gold: #eab75d;
        --blue: #256b8e;
      }
      * {
        box-sizing: border-box;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07131d;
        color: var(--ink);
        font-family: system-ui, "Yu Gothic", sans-serif;
      }
      button {
        font: inherit;
        font-weight: 900;
        border: 2px solid #5d3b22;
        border-radius: 10px;
        color: #352312;
        background: linear-gradient(#fff0b4, #d99a43);
        box-shadow: 0 4px 0 #6c4025;
      }
      button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #6c4025;
      }
      .screen {
        display: none;
        width: 100%;
        height: 100%;
      }
      .screen.active {
        display: grid;
      }
      .pixel {
        image-rendering: pixelated;
      }
      .title {
        place-items: center;
        background:
          linear-gradient(#071825aa, #071825ee),
          radial-gradient(circle at 70% 15%, #fff7bd 0 2%, transparent 3%),
          linear-gradient(#193d58, #6da2aa 58%, #172d25 59%);
        color: #fff;
        text-align: center;
      }
      .title-box {
        width: min(88vw, 720px);
        padding: 4vh 5vw;
        border: 4px double #f4cf78;
        background: #10283add;
        box-shadow:
          0 0 0 5px #271b19,
          0 14px 35px #0008;
      }
      .title h1 {
        margin: 0;
        color: #ffe99d;
        font-size: clamp(1.8rem, 6vw, 4rem);
        text-shadow: 4px 4px #552b26;
      }
      .title p {
        margin: 0.7em;
      }
      .title button {
        padding: 12px 42px;
        font-size: 1.1rem;
      }
      .game {
        grid-template-rows: auto 1fr;
        background: #10283a;
      }
      .hud {
        display: flex;
        gap: 7px;
        align-items: center;
        padding: max(4px, env(safe-area-inset-top)) 8px 5px;
        color: #fff;
        background: #172434;
        border-bottom: 2px solid #d7ad5a;
        font-size: clamp(0.67rem, 1.7vw, 0.9rem);
      }
      .hud span {
        padding: 4px 8px;
        border: 1px solid #ffffff2c;
        border-radius: 7px;
        background: #ffffff10;
      }
      .hud .grow {
        flex: 1;
      }
      .world {
        position: relative;
        min-height: 0;
        overflow: hidden;
        background: #69a056;
      }
      .map {
        position: absolute;
        inset: 0 auto 0 0;
        width: 300%;
        overflow: hidden;
        background: #69a056;
        transition: transform 0.18s linear;
      }
      .lake {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 57%;
        background: repeating-linear-gradient(
          0deg,
          #277ea1 0 5px,
          #318caf 6px 10px
        );
        animation: water 3s linear infinite;
      }
      .shore {
        position: absolute;
        inset: 54% 0 0;
        background: linear-gradient(#d5b36b 0 10%, #6d9b50 11%);
        border-top: 5px solid #f0d080;
      }
      .dock {
        position: absolute;
        left: 42%;
        top: 35%;
        width: 19%;
        height: 42%;
        background: repeating-linear-gradient(
          90deg,
          #805128 0 13px,
          #a66b32 14px 25px
        );
        border: 4px solid #55361f;
      }
      .shop {
        position: absolute;
        left: 84%;
        bottom: 16%;
        width: 18%;
        height: 32%;
        min-width: 88px;
        background: #a75a38;
        border: 5px solid #552f24;
      }
      .shop:before {
        content: "釣具店";
        position: absolute;
        inset: -23px 5% auto;
        background: #f4d27c;
        border: 3px solid #57351f;
        text-align: center;
        font-weight: 900;
      }
      .shop:after {
        content: "🏮";
        position: absolute;
        right: -16px;
        top: 15%;
      }
      .trees {
        position: absolute;
        left: 2%;
        bottom: 6%;
        font-size: clamp(2rem, 7vw, 5rem);
        letter-spacing: -0.5em;
        filter: drop-shadow(3px 5px #294a2c);
      }
      .building {
        position: absolute;
        bottom: 15%;
        width: 8%;
        height: 29%;
        border: 4px solid #523426;
        background: linear-gradient(#be6c48 0 68%, #8b4c38 69%);
        box-shadow:
          inset 0 -12px #623725,
          5px 6px #0003;
      }
      .building::before {
        content: attr(data-name);
        position: absolute;
        inset: -22px 4% auto;
        padding: 2px;
        border: 2px solid #563721;
        background: #f1d080;
        text-align: center;
        font-size: clamp(0.55rem, 1.4vw, 0.78rem);
        font-weight: 900;
      }
      .building::after {
        content: "";
        position: absolute;
        left: 38%;
        bottom: 0;
        width: 25%;
        height: 48%;
        background: #472d24;
        border: 2px solid #241917;
      }
      .house-a {
        left: 7%;
      }
      .house-b {
        left: 18%;
        background: linear-gradient(#587f87 0 68%, #3e5d67 69%);
      }
      .diner {
        left: 54%;
        width: 10%;
        background: linear-gradient(#d47d3e 0 68%, #9f4d2f 69%);
      }
      .market {
        left: 66%;
        width: 11%;
        background: linear-gradient(#658d58 0 68%, #45683f 69%);
      }
      .mystery {
        left: 78%;
        width: 7%;
        filter: brightness(0.65);
      }
      .rescue-spot {
        position: absolute;
        left: 31%;
        bottom: 14%;
        width: 5%;
        height: 8%;
        border-radius: 50%;
        background: #79502f;
        box-shadow: inset 0 5px #4f3324;
      }
      .player {
        position: absolute;
        width: 46px;
        height: 58px;
        transform: translate(-50%, -50%);
        background-size: 300% 100%;
        background-position: 0 50%;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        z-index: 5;
      }
      .player.boy {
        background-image: url("assets/player-boy.png");
      }
      .player.girl {
        background-image: url("assets/player-girl.png");
      }
      .player.face-side {
        background-position-x: 50%;
      }
      .player.face-up {
        background-position-x: 100%;
      }
      .player.boy.face-right,
      .player.girl.face-left {
        transform: translate(-50%, -50%) scaleX(-1);
      }
      .player.walking {
        animation: player-step 0.24s steps(2) 2;
      }
      .player.companion-pet {
        background-size: 200% 100%;
        background-position: 0 50%;
        transform-origin: center bottom;
        animation: none;
      }
      .player.boy.companion-pet {
        background-image: url("assets/player-boy-pet.png?v=16c");
      }
      .player.girl.companion-pet {
        background-image: url("assets/player-girl-pet.png?v=16c");
      }
      .player.companion-pet.face-left {
        transform: translate(-50%, -50%);
      }
      .player.companion-pet.face-right {
        transform: translate(-50%, -50%) scaleX(-1);
      }
      /* Every pose shares the standing sprite's shoe contact point. */
      .player.boy.companion-pet.face-left {
        margin-left: -4px;
        margin-top: -1px;
      }
      .player.boy.companion-pet.face-right {
        margin-left: 4px;
        margin-top: -1px;
      }
      .player.girl.companion-pet {
        margin-top: -2px;
      }
      .player.companion-pet::before,
      .player.companion-pet::after {
        display: none !important;
      }
      .player.companion-sit {
        background-size: 100% 100%;
        background-position: center;
        transform-origin: center bottom;
        animation: none;
      }
      .player.boy.companion-sit {
        background-image: url("assets/player-boy-sit.png?v=16");
      }
      .player.girl.companion-sit {
        background-image: url("assets/player-girl-sit.png?v=16");
      }
      .player.companion-sit.face-left {
        transform: translate(-50%, -50%);
      }
      .player.companion-sit.face-right {
        transform: translate(-50%, -50%) scaleX(-1);
      }
      @keyframes player-step {
        50% {
          margin-top: -3px;
        }
      }
      .player:before {
        content: "";
        position: absolute;
        left: 8px;
        top: 0;
        width: 18px;
        height: 17px;
        background: #f1c39a;
        border: 3px solid #432c25;
        box-shadow: 0 17px 0 4px #284d68;
      }
      .player:after {
        content: "";
        position: absolute;
        left: 3px;
        top: -5px;
        width: 28px;
        height: 9px;
        background: #3c2b26;
        border: 2px solid #231a18;
      }
      .player.boy::before,
      .player.boy::after,
      .player.girl::before,
      .player.girl::after {
        display: none;
      }
      .companion {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 42px;
        height: 38px;
        display: grid;
        place-items: center;
        font-size: 25px;
        z-index: 4;
        image-rendering: pixelated;
        background-repeat: no-repeat;
        transition: left 0.62s ease-in-out, top 0.28s ease-out;
        will-change: left, top;
      }
      .companion.canvas-dog {
        /* The dog assets are now pre-cached; avoid drawing a second sprite
           underneath Canvas (Riku's differently sized sheet exposed it). */
        background-image: none !important;
        background-color: transparent;
      }
      .companion canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        pointer-events: none;
        transform-origin: center bottom;
      }
      .companion.face-player-right canvas {
        transform: scaleX(-1);
      }
      .companion.shuu {
        background-image: url("assets/shuu-walk.png?v=12");
      }
      .companion.grey {
        background-image: url("assets/grey-walk.png?v=12");
      }
      .companion.shuu,
      .companion.grey,
      .companion.riku {
        background-size: 400% 300%;
        color: transparent;
      }
      .companion.riku {
        background-image: url("assets/riku-walk.png?v=12");
      }
      .companion.dir-down {
        background-position: 0 50%;
      }
      .companion.dir-left {
        background-position: 33.333% 50%;
      }
      .companion.dir-right {
        background-position: 66.667% 50%;
      }
      .companion.dir-up {
        background-position: 100% 50%;
      }
      .companion.walking {
        animation: dog-step 0.3s steps(1) infinite;
      }
      .companion.walking canvas {
        animation: dog-paws 0.17s steps(2) infinite;
      }
      .companion.idle-sit,
      .companion.idle-sleep,
      .companion.idle-dig,
      .companion.idle-beg {
        background-image: url("assets/dog-idles.png?v=12");
        background-size: 400% 300%;
      }
      .companion.shuu[class*="idle-"] { background-position-y: 0; }
      .companion.riku[class*="idle-"] { background-position-y: 50%; }
      .companion.grey[class*="idle-"] { background-position-y: 100%; }
      .companion.idle-sit { background-position-x: 0; }
      .companion.idle-sleep { background-position-x: 33.333%; animation: dog-breathe 2.4s ease-in-out infinite; }
      .companion.idle-dig { background-position-x: 66.667%; animation: dog-dig .28s steps(2) infinite; }
      .companion.idle-beg { background-position-x: 100%; animation: dog-beg .8s ease-in-out infinite; }
      .companion.idle-beg::after {
        content: "♡";
        position: absolute;
        left: 50%;
        top: -22px;
        transform: translateX(-50%);
        color: #ff8fa8;
        font-size: 16px;
        text-shadow: 1px 1px #fff;
      }
      @keyframes dog-step {
        0% {
          background-position-y: 0;
        }
        50% {
          background-position-y: 100%;
        }
        100% {
          background-position-y: 0;
        }
      }
      @keyframes dog-paws {
        50% { transform: translateY(-1px); }
      }
      @keyframes dog-breathe {
        50% { transform: translate(-50%, -50%) scale(1.03, .98); }
      }
      @keyframes dog-dig {
        50% { transform: translate(-51%, -49%); filter: brightness(1.08); }
      }
      @keyframes dog-beg {
        50% { transform: translate(-50%, -53%); }
      }
      .sam {
        position: absolute;
        left: 4%;
        bottom: 1%;
        width: 52px;
        height: 70px;
        z-index: 20;
        background: url("assets/sam-front.png") center bottom / contain no-repeat;
        image-rendering: pixelated;
      }
      .sam::before {
        content: none;
      }
      .sam::after {
        content: "サム";
        position: absolute;
        left: 50%;
        top: -13px;
        transform: translateX(-50%);
        color: #fff1a5;
        font: 900 9px monospace;
        text-shadow: 1px 1px #000;
      }
      .hint {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        z-index: 8;
        max-width: 74%;
        padding: 5px 10px;
        border: 2px solid #f1ce73;
        border-radius: 8px;
        background: #102033dc;
        color: #fff;
        font-size: clamp(0.7rem, 1.7vw, 0.9rem);
        text-align: center;
      }
      .controls {
        position: absolute;
        inset: auto 0 7px;
        z-index: 10;
        pointer-events: none;
      }
      .dpad {
        position: absolute;
        left: 14px;
        bottom: 0;
        width: 128px;
        height: 96px;
      }
      .dpad button,
      .actions button {
        position: absolute;
        pointer-events: auto;
        width: 43px;
        height: 43px;
        padding: 0;
        border-radius: 8px;
        background: #27364ddb;
        color: #fff;
        border-color: #cbb274;
        box-shadow: 0 3px 0 #111;
      }
      .up {
        left: 43px;
      }
      .down {
        left: 43px;
        top: 48px;
      }
      .left {
        top: 48px;
      }
      .right {
        left: 86px;
        top: 48px;
      }
      .actions {
        position: absolute;
        right: 16px;
        bottom: 0;
        width: 130px;
        height: 90px;
      }
      .actions button {
        border-radius: 50%;
        font-size: 1rem;
      }
      .a {
        right: 0;
        top: 2px;
        background: #b9343f !important;
      }
      .b {
        left: 16px;
        top: 42px;
        background: #346a9a !important;
      }
      .modal {
        display: none;
        position: absolute;
        z-index: 30;
        inset: 6%;
        padding: 10px;
        border: 4px double #f2cd70;
        border-radius: 12px;
        background: #132238f5;
        color: #fff;
        overflow: auto;
      }
      .modal.open {
        display: block;
      }
      .modal h2 {
        margin: 0 0 8px;
        color: #ffe69a;
      }
      .modal .close {
        float: right;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }
      .item {
        padding: 8px;
        border: 1px solid #ffffff28;
        border-radius: 8px;
        background: #ffffff0c;
      }
      .fish-scene {
        display: none;
        position: absolute;
        z-index: 20;
        inset: 0;
        background: linear-gradient(#79c9ed 0 18%, #17749f 19%, #063f66);
      }
      .fish-scene.active {
        display: block;
      }
      .surface {
        height: 18%;
        background: repeating-linear-gradient(
          0deg,
          #b9ebff 0 4px,
          #78cbe9 5px 9px
        );
      }
      .fisher {
        position: absolute;
        left: 8%;
        top: 7%;
        font-size: clamp(2rem, 7vw, 4rem);
      }
      .line {
        position: absolute;
        left: 18%;
        top: 12%;
        width: 2px;
        height: 54%;
        background: #e8f4ed;
        transform-origin: top;
      }
      .line-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .line-svg path {
        fill: none;
        stroke: #e8f4ed;
        stroke-width: 3;
        vector-effect: non-scaling-stroke;
        filter: drop-shadow(1px 1px #06304c);
        transition: 0.22s;
      }
      .hook {
        position: absolute;
        left: calc(18% - 6px);
        top: 64%;
        font-size: 18px;
      }
      .battle-fish {
        position: absolute;
        left: 68%;
        top: 55%;
        width: clamp(100px, 19vw, 190px);
        height: clamp(62px, 12vw, 120px);
        background-size: 300% 100%;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        transform: translate(-50%, -50%);
        transition: left 0.18s linear, top 0.18s linear, transform 0.15s ease;
        filter: drop-shadow(5px 5px #082e4b);
      }
      .dog-select {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin: 9px 0;
      }
      .dog-select button {
        padding: 7px 12px;
        font-size: 0.82rem;
      }
      .dog-select button.active {
        outline: 3px solid #fff3a0;
      }
      .avatar-select {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin: 7px 0;
      }
      .avatar-select button {
        padding: 6px 14px;
        font-size: 0.82rem;
      }
      .avatar-select button.active {
        outline: 3px solid #91e6ff;
      }
      .battle-ui {
        position: absolute;
        top: 23%;
        left: 3%;
        width: 38%;
        padding: 8px;
        border: 2px solid #f2ce76;
        background: #10243edb;
        color: #fff;
        border-radius: 8px;
      }
      .meter {
        height: 12px;
        margin: 4px 0 8px;
        background: #09131f;
        border: 1px solid #fff5;
        border-radius: 9px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0;
        background: #65d47d;
        transition: 0.2s;
      }
      .tension {
        background: #e0b34e;
      }
      .battle-msg {
        min-height: 2.7em;
        font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      }
      .battle-actions {
        position: absolute;
        right: 4%;
        bottom: 5%;
        display: flex;
        gap: 10px;
      }
      .battle-actions button {
        width: 96px;
        height: 64px;
        touch-action: none;
      }
      .cast-meter {
        position: relative;
        height: 18px;
        margin: 7px 0;
        overflow: hidden;
        border: 2px solid #fff;
        background: linear-gradient(90deg,#bde7a6 0 33%,#f7df78 34% 67%,#efa09b 68%);
      }
      .cast-marker {
        position: absolute;
        left: 0;
        width: 5px;
        height: 100%;
        background: #142033;
        transform: translateX(-50%);
      }
      .tackle-options { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
      .tackle-options button.selected { outline:3px solid #69d8ff; }
      .landscape-warning {
        display: none;
      }
      @keyframes water {
        to {
          background-position: 0 10px;
        }
      }
      @media (orientation: portrait) {
        .landscape-warning {
          display: grid;
          position: fixed;
          z-index: 99;
          inset: 0;
          place-items: center;
          padding: 12%;
          background: #10283a;
          color: #fff;
          text-align: center;
        }
        .screen {
          visibility: hidden;
        }
      }
      @media (max-height: 420px) {
        .hud {
          font-size: 0.65rem;
        }
        .controls {
          bottom: 4px;
        }
        .modal {
          inset: 3%;
        }
        .battle-ui {
          top: 20%;
        }
      }
    </style>
  </head>
  <body>
    <div class="landscape-warning">
      📱 スマホを横向きにしてね<br />星降る湖が広がるよ
    </div>
    <section id="title" class="screen title active">
      <div class="title-box">
        <small>犬小屋釣行記</small>
        <h1>ぬし釣り犬小屋</h1>
        <h2>星降る湖</h2>
        <p>Fableリクの釣りメモを手に、湖のヌシを追え。</p>
        <div class="avatar-select" aria-label="主人公を選ぶ">
          <button data-avatar="boy">🧢 男の子</button>
          <button data-avatar="girl">🧢 女の子</button>
        </div>
        <div class="dog-select" aria-label="同行するワンコ">
          <button data-dog="shuu">🐕 シュウ</button>
          <button data-dog="riku">🐕‍🦺 リク</button>
          <button data-dog="grey">🐕 Grey</button>
        </div>
        <button id="start">湖へ行く</button>
      </div>
    </section>
    <section id="game" class="screen game">
      <header class="hud">
        <b>星降る湖</b><span>v16</span><span id="time">朝</span
        ><span>💰 <b id="money">300</b>円</span
        ><span>🪱 <b id="bait">5</b></span
        ><span class="grow">🎣 <b id="rod">竹の竿</b></span
        ><button id="menu">記録</button>
      </header>
      <main class="world" id="world">
        <div class="map" id="map">
          <div class="lake"></div>
          <div class="shore"></div>
          <div class="dock"></div>
          <div class="shop"><div class="sam" aria-label="サミュエル・オールドマン"></div></div>
          <div class="building house-a" data-name="湖畔の民家"></div>
          <div class="building house-b" data-name="釣り宿"></div>
          <div class="building diner" data-name="ワカサギ食堂"></div>
          <div class="building market" data-name="魚市場"></div>
          <div class="building mystery" data-name="閉じた小屋"></div>
          <div class="rescue-spot" aria-label="エサ採集ポイント"></div>
          <div class="trees">🌲🌲🌲</div>
          <div id="player" class="player"></div>
          <div id="dog" class="companion canvas-dog"><canvas id="dogSprite" width="320" height="320"></canvas></div>
        </div>
        <div class="hint" id="hint">十字キーで歩こう。桟橋ではAで釣り。</div>
        <div class="controls">
          <div class="dpad">
            <button class="up" data-move="up">▲</button
            ><button class="left" data-move="left">◀</button
            ><button class="down" data-move="down">▼</button
            ><button class="right" data-move="right">▶</button>
          </div>
          <div class="actions">
            <button class="a" id="action">A</button
            ><button class="b" id="back">B</button>
          </div>
        </div>
        <div class="fish-scene" id="fishScene">
          <div class="surface"></div>
          <div class="fisher">🧑‍🌾🎣</div>
          <svg
            class="line-svg"
            viewBox="0 0 1000 500"
            preserveAspectRatio="none"
          >
            <path id="linePath" d="M 150 50 Q 180 220 650 310" />
          </svg>
          <div class="hook">🪝</div>
          <div class="battle-fish" id="battleFish"></div>
          <div class="battle-ui">
            <b id="fishName">キャスト</b><small id="phaseLabel"> 距離</small>
            <div class="cast-meter" id="castMeter"><div class="cast-marker" id="castMarker"></div></div>
            <div class="meter"><div class="fill" id="hp"></div></div>
            <small>糸テンション</small>
            <div class="meter"><div class="fill tension" id="ten"></div></div>
            <div class="battle-msg" id="battleMsg">魚の動きを見よう。</div>
          </div>
          <div class="battle-actions">
            <button id="pull">A<br /><small>投げる</small></button
            ><button id="wait">B<br /><small>やめる</small></button>
          </div>
        </div>
        <div class="modal" id="record">
          <button class="close" data-close>閉じる</button>
          <h2>釣り人手帳</h2>
          <div class="grid" id="book"></div>
          <h3>最近の出来事</h3>
          <div id="log"></div>
        </div>
        <div class="modal" id="store">
          <button class="close" data-close>閉じる</button>
          <h2>サミュエル・オールドマン</h2>
          <p>「釣具は未来を引き寄せるんじゃよ」</p>
          <div class="grid">
            <button data-buy-bait="worm">ミミズ3個・120円</button>
            <button data-buy-bait="river">川虫2個・180円</button>
            <button data-buy-bait="paste">練りエサ2個・240円</button>
            <button data-buy-rod="moroko">ホンモロコ竿・1500円</button>
          </div>
        </div>
        <div class="modal" id="tackle">
          <button class="close" data-close>閉じる</button>
          <h2>仕掛けを選ぶ</h2>
          <p>エサ</p><div class="tackle-options" id="baitOptions"></div>
          <p>釣具</p><div class="tackle-options" id="rodOptions"></div>
          <button id="beginCast">この仕掛けで釣る</button>
        </div>
      </main>
    </section>
    <script>
      const $ = (s) => document.querySelector(s),
        fish = [
          {
            id: "moroko",
            name: "ホンモロコ",
            price: 90,
            hp: 45,
            w: 0.44,
            icon: "🐟",
            shadowRow: 0,
          },
          {
            id: "funa",
            name: "フナ",
            price: 130,
            hp: 65,
            w: 0.31,
            icon: "🐠",
            shadowRow: 1,
          },
          {
            id: "koi",
            name: "コイ",
            price: 260,
            hp: 100,
            w: 0.2,
            icon: "🐡",
            shadowRow: 2,
          },
          {
            id: "nushi",
            name: "星湖のヌシ",
            price: 2000,
            hp: 210,
            w: 0.05,
            icon: "🐋",
            shadowRow: 4,
          },
        ],
        baitData = {
          worm: { name: "ミミズ", price: 120, amount: 3, bite: 1 },
          river: { name: "川虫", price: 180, amount: 2, bite: 1.35 },
          paste: { name: "練りエサ", price: 240, amount: 2, bite: 1.15 },
        },
        rodData = {
          bamboo: { name: "竹の竿", power: 16, control: 1 },
          moroko: { name: "ホンモロコ竿", power: 30, control: 1.35 },
        },
        fishAssets = {
          moroko: "assets/fish-moroko.png",
          funa: "assets/fish-funa.png",
          koi: "assets/fish-koi.png",
          nushi: "assets/fish-nushi.png",
        },
        key = "nushi-inugoya-v2";
      let s = Object.assign(
          {
            money: 300,
            bait: 5,
            baits: null,
            selectedBait: "worm",
            selectedRod: "bamboo",
            ownedRods: ["bamboo"],
            rod: "竹の竿",
            power: 16,
            caught: {},
            log: [],
            time: 0,
            x: 30,
            y: 78,
            dog: "riku",
            avatar: "boy",
            direction: "down",
            rescueAt: -99,
            calmBonus: 0,
          },
          JSON.parse(localStorage.getItem(key) || "{}"),
        ),
        battle = null,
        timer = 0,
        walkTimer = 0,
        idleTimer = 0,
        idleActionTimer = 0,
        companionReactionTimer = 0,
        reactionTransitionTimer = 0,
        dogIdleMode = "",
        companionReaction = "",
        dogApproachOffset = 0,
        dogMotionDirection = "",
        dogWalking = false,
        dogAnimFrame = 0;
      function loadDogImage(src) {
        const image = new Image();
        image.onload = () => drawDog();
        image.src = src;
        // Some mobile browsers can finish a cached image before the normal
        // load callback is observed. Decode gives that path a second redraw.
        if (image.decode) image.decode().then(drawDog).catch(() => {});
        setTimeout(drawDog, 300);
        return image;
      }
      const dogImages = {
          shuu: loadDogImage("assets/shuu-walk.png?v=12"),
          riku: loadDogImage("assets/riku-walk.png?v=12"),
          grey: loadDogImage("assets/grey-walk.png?v=12"),
        },
        dogIdleImage = loadDogImage("assets/dog-idles.png?v=12");
      if (!s.baits) s.baits = { worm: s.bait ?? 5, river: 0, paste: 0 };
      if (s.rod === "ホンモロコ竿" && !s.ownedRods.includes("moroko"))
        s.ownedRods.push("moroko");
      function save() {
        localStorage.setItem(key, JSON.stringify(s));
      }
      function vibrate(pattern) {
        try { navigator.vibrate?.(pattern); } catch (_) {}
      }
      function log(t) {
        s.log.unshift(t);
        s.log = s.log.slice(0, 12);
        save();
        renderRecord();
      }
      function near(x, y, r = 13) {
        return Math.hypot(s.x - x, s.y - y) < r;
      }
      function dogFollowPosition() {
        const offset = {
          left: { x: 6, y: 3 },
          right: { x: -6, y: 3 },
          up: { x: -4, y: 7 },
          down: { x: -4, y: -6 },
        }[s.direction] || { x: -4, y: -6 };
        return {
          left: Math.max(1, Math.min(99, (s.x + offset.x) / 3)),
          top: Math.max(61, Math.min(93, s.y + offset.y)),
        };
      }
      function companionDirection() {
        const dogPosition = dogFollowPosition();
        const playerLeft = s.x / 3;
        // The companion waits diagonally behind the player.  For reactions,
        // prefer the horizontal side so the hand reaches toward the dog
        // instead of making the player stare past it vertically.
        return dogPosition.left < playerLeft ? "left" : "right";
      }
      function dogDisplayLeft(position = dogFollowPosition()) {
        return Math.max(1, Math.min(99, position.left + dogApproachOffset));
      }
      function renderPlayer() {
        const direction = companionReaction ? companionDirection() : s.direction;
        const facing = direction === "up"
          ? "face-up"
          : ["left", "right"].includes(direction) ? "face-side" : "";
        const reactionClass = companionReaction ? `companion-${companionReaction}` : "";
        $("#player").className = `player ${s.avatar} ${facing} face-${direction} ${reactionClass}`;
      }
      function render() {
        s.x = Math.max(5, Math.min(287, s.x));
        s.y = Math.max(61, Math.min(93, s.y));
        const mapX = s.x / 3;
        const camera = Math.max(0, Math.min(200, s.x - 50));
        $("#map").style.transform = `translateX(${-camera / 3}%)`;
        $("#player").style.left = `${mapX}%`;
        $("#player").style.top = `${s.y}%`;
        renderPlayer();
        const dogPosition = dogFollowPosition();
        $("#dog").style.left = `${dogDisplayLeft(dogPosition)}%`;
        $("#dog").style.top = `${dogPosition.top}%`;
        $("#dog").style.zIndex = dogPosition.top > s.y ? "6" : "4";
        $("#dog").className = `companion canvas-dog ${s.dog} dir-${s.direction} ${dogIdleMode}`;
        drawDog();
        $("#money").textContent = s.money;
        s.bait = s.baits[s.selectedBait] || 0;
        s.rod = rodData[s.selectedRod].name;
        s.power = rodData[s.selectedRod].power;
        $("#bait").textContent = `${baitData[s.selectedBait].name}×${s.bait}`;
        $("#rod").textContent = s.rod;
        $("#time").textContent = ["朝", "昼", "夕", "夜"][s.time % 4];
        $("#hint").textContent = near(130, 70)
          ? "桟橋だ。Aでエサと釣具を選ぶ。"
          : near(258, 72)
            ? "釣具店だ。Aで入る。"
            : near(96, 82)
              ? "柔らかい土だ。エサが無い時はワンコに相談できそう。"
              : "湖畔の町を歩こう。建物や気になる場所ではA。";
        save();
      }
      function move(d) {
        if (battle) return;
        wakeDog();
        dogWalking = true;
        s.direction = d;
        let n = 4;
        ({
          left: () => (s.x -= n),
          right: () => (s.x += n),
          up: () => (s.y -= n),
          down: () => (s.y += n),
        })[d]();
        render();
        $("#player").classList.add("walking");
        $("#dog").classList.add("walking");
        clearTimeout(walkTimer);
        walkTimer = setTimeout(() => {
          dogWalking = false;
          $("#player").classList.remove("walking");
          $("#dog").classList.remove("walking");
          drawDog();
          armDogIdle();
        }, 320);
      }
      function drawDog() {
        const canvas = $("#dogSprite");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;
        const direction = {
          down: 0,
          left: 1,
          right: 2,
          up: 3,
        }[dogMotionDirection || s.direction] ?? 0;
        let image, size, col, row;
        if (dogIdleMode && !dogWalking) {
          image = dogIdleImage;
          size = 320;
          col = { "idle-sit": 0, "idle-sleep": 1, "idle-dig": 2, "idle-beg": 3 }[dogIdleMode] ?? 0;
          row = { shuu: 0, riku: 1, grey: 2 }[s.dog] ?? 1;
        } else {
          image = dogImages[s.dog] || dogImages.riku;
          size = s.dog === "riku" ? 362 : 320;
          col = direction;
          // Riku's upper/lower walk frames have a much larger vertical shift.
          // Keep his stable middle frame and let the 1px CSS paw-step animate it.
          row = dogWalking && s.dog !== "riku" ? (dogAnimFrame % 2 ? 0 : 2) : 1;
        }
        if (!image.complete || !image.naturalWidth) return;
        ctx.drawImage(image, col * size, row * size, size, size, 0, 0, 320, 320);
      }
      function wakeDog() {
        clearTimeout(idleTimer);
        clearTimeout(idleActionTimer);
        clearTimeout(companionReactionTimer);
        clearTimeout(reactionTransitionTimer);
        dogIdleMode = "";
        companionReaction = "";
        dogApproachOffset = 0;
        dogMotionDirection = "";
        dogWalking = false;
        $("#dog")?.classList.remove("idle-sit", "idle-sleep", "idle-dig", "idle-beg");
        $("#dog").style.left = `${dogDisplayLeft()}%`;
        renderPlayer();
        drawDog();
      }
      function setCompanionReaction(reaction) {
        if (battle || !dogIdleMode) return;
        clearTimeout(reactionTransitionTimer);
        const dogPosition = dogFollowPosition();
        const playerLeft = s.x / 3;
        const dog = $("#dog");
        dog.classList.toggle("face-player-right", dogPosition.left < playerLeft);
        // The dog walks into contact first.  Only then does the owner change
        // pose, so neither sprite teleports between animation states.
        if (reaction === "pet") {
          dogApproachOffset = Math.sign(playerLeft - dogPosition.left) * 0.85;
          dogMotionDirection = dogPosition.left < playerLeft ? "right" : "left";
          dogWalking = true;
          dog.className = `companion canvas-dog ${s.dog} dir-${dogMotionDirection} walking`;
          drawDog();
          dog.style.left = `${dogDisplayLeft(dogPosition)}%`;
          reactionTransitionTimer = setTimeout(() => {
            if (battle || !dogIdleMode) return;
            dogWalking = false;
            dogMotionDirection = "";
            companionReaction = reaction;
            dog.className = `companion canvas-dog ${s.dog} dir-${s.direction} ${dogIdleMode}`;
            dog.classList.toggle("face-player-right", dogPosition.left < playerLeft);
            drawDog();
            renderPlayer();
          }, 620);
          return;
        }
        companionReaction = reaction;
        renderPlayer();
      }
      function setDogIdle(mode) {
        if (battle) return;
        clearTimeout(companionReactionTimer);
        clearTimeout(reactionTransitionTimer);
        companionReaction = "";
        dogWalking = false;
        dogMotionDirection = "";
        dogIdleMode = `idle-${mode}`;
        const dogPosition = dogFollowPosition();
        $("#dog").style.left = `${dogDisplayLeft(dogPosition)}%`;
        $("#dog").className = `companion canvas-dog ${s.dog} dir-${s.direction} ${dogIdleMode}`;
        drawDog();
        renderPlayer();
        // Give the dog a brief moment to settle before the owner responds.
        if (mode === "beg")
          companionReactionTimer = setTimeout(() => setCompanionReaction("pet"), 650);
        else if (mode === "sleep")
          companionReactionTimer = setTimeout(() => setCompanionReaction("sit"), 900);
      }
      function armDogIdle() {
        wakeDog();
        idleTimer = setTimeout(() => setDogIdle("sit"), 1000);
        idleActionTimer = setTimeout(randomDogIdle, 30000);
      }
      function randomDogIdle() {
        if (battle) return;
        const modes = ["sleep", "dig", "beg"];
        setDogIdle(modes[Math.floor(Math.random() * modes.length)]);
        idleActionTimer = setTimeout(randomDogIdle, 8000 + Math.random() * 6000);
      }
      function action() {
        if (near(130, 70)) cast();
        else if (near(258, 72)) open("store");
        else if (near(96, 82)) rescue();
        else if (near(23, 76))
          log("民家のおばあさんが『夕方はフナが寄るよ』と教えてくれた。");
        else if (near(55, 76)) log("釣り宿だ。二階から湖がよく見える。");
        else if (near(174, 76))
          log("ワカサギ食堂。釣った魚を料理する機能は準備中だ。");
        else if (near(210, 76))
          log("魚市場。大きな魚ほど高く買ってくれそうだ。");
        else if (near(238, 76)) log("閉じた小屋だ。中から水音が聞こえる……。");
        else log(`${dogName()}が辺りの匂いを確かめた。`);
      }
      function dogName() {
        return { shuu: "シュウ", riku: "リク", grey: "Grey" }[s.dog] || "リク";
      }
      function rescue() {
        const totalBait = Object.values(s.baits).reduce((a,b) => a + b, 0);
        if (totalBait > 0 || s.money >= 120)
          return log(`${dogName()}「まだ自分の力で準備できるよ」`);
        if (s.time - s.rescueAt < 2)
          return log(
            `${dogName()}はさっき探した場所を見つめている。少し時間を置こう。`,
          );
        s.rescueAt = s.time;
        if (s.dog === "shuu") {
          s.baits.worm += 3;
          log("シュウが夢中で土を掘り、ミミズを3匹見つけた！");
        } else if (s.dog === "grey") {
          s.baits.worm += 2;
          s.money += 40;
          log("Greyが落とし物の40円とエサ2匹を静かに見つけた。");
        } else {
          s.baits.river += 2;
          s.selectedBait = "river";
          s.calmBonus = 1;
          log("リクが水辺を観察して川虫を2匹発見。次の魚が止まりやすくなる！");
        }
        render();
      }
      function pick() {
        let r = Math.random(),
          a = 0;
        for (const f of fish) {
          a += f.w;
          if (r <= a) return f;
        }
        return fish[0];
      }
      function cast() {
        wakeDog();
        battle = { phase: "prep", reeling: false };
        $("#fishScene").classList.add("active");
        $("#battleFish").style.opacity = "0";
        $("#castMeter").style.display = "none";
        $("#hp").parentElement.style.display = "none";
        $("#ten").parentElement.style.display = "none";
        $("#fishName").textContent = "釣行準備";
        $("#phaseLabel").textContent = " 仕掛け確認";
        $("#battleMsg").textContent = `${baitData[s.selectedBait].name} ×${s.baits[s.selectedBait] || 0}／${rodData[s.selectedRod].name}`;
        $("#pull").innerHTML = "A<br><small>釣りを始める</small>";
        $("#wait").innerHTML = "B<br><small>仕掛け変更</small>";
      }
      function renderTackle() {
        $("#baitOptions").innerHTML = Object.entries(baitData).map(([id,b]) =>
          `<button data-pick-bait="${id}" class="${s.selectedBait === id ? "selected" : ""}">${b.name} ×${s.baits[id] || 0}</button>`).join("");
        $("#rodOptions").innerHTML = s.ownedRods.map(id =>
          `<button data-pick-rod="${id}" class="${s.selectedRod === id ? "selected" : ""}">${rodData[id].name}</button>`).join("");
        document.querySelectorAll("[data-pick-bait]").forEach(b => b.onclick = () => {
          s.selectedBait = b.dataset.pickBait; renderTackle(); render();
        });
        document.querySelectorAll("[data-pick-rod]").forEach(b => b.onclick = () => {
          s.selectedRod = b.dataset.pickRod; renderTackle(); render();
        });
      }
      function beginFishing() {
        wakeDog();
        s.bait = s.baits[s.selectedBait] || 0;
        if (s.bait < 1) {
          $("#hint").textContent =
            s.money >= 120
              ? "エサがない！釣具店を開くよ。エサを買おう。"
              : `エサもお金もない！${dogName()}が助けに来た。`;
          close();
          if (s.money >= 120) open("store");
          else rescue();
          return;
        }
        s.baits[s.selectedBait]--;
        s.time++;
        close();
        battle = {
          phase: "cast",
          cast: 0,
          castDir: 1,
          f: null,
          hp: 1,
          max: 1,
          ten: 18,
          calm: false,
          x: 68,
          y: 55,
          frame: 0,
          reeling: false,
        };
        $("#fishScene").classList.add("active");
        $("#battleFish").style.opacity = "0";
        $("#castMeter").style.display = "block";
        $("#hp").parentElement.style.display = "none";
        $("#ten").parentElement.style.display = "none";
        $("#fishName").textContent = "キャスト";
        $("#phaseLabel").textContent = " 距離を決める";
        $("#battleMsg").textContent = "Aを押して投げる！遠いほど大物が狙える。";
        $("#pull").innerHTML = "A<br><small>投げる！</small>";
        $("#wait").innerHTML = "B<br><small>やめる</small>";
        battleTick();
        drawBattle();
        render();
      }
      function battleTick() {
        clearInterval(timer);
        timer = setInterval(() => {
          if (!battle) return;
          if (battle.phase === "cast") {
            battle.cast += battle.castDir * 3;
            if (battle.cast >= 100 || battle.cast <= 0) battle.castDir *= -1;
            $("#castMarker").style.left = `${battle.cast}%`;
            return;
          }
          if (battle.phase === "wait") {
            const now = Date.now();
            if (now >= battle.biteAt && now <= battle.biteAt + 1050) {
              battle.phase = "bite";
              vibrate([90, 55, 170]);
              $("#battleMsg").textContent = "消し込んだ！！今だ、Aで合わせる！";
              $("#pull").innerHTML = "A<br><small>合わせる！</small>";
            }
            return;
          }
          if (battle.phase === "bite") {
            if (Date.now() > battle.biteAt + 1050) lose("合わせが遅れた……魚はエサだけ持っていった。");
            return;
          }
          if (battle.phase !== "fight") return;
          const control = rodData[s.selectedRod].control;
          if (!battle.nextMood || Date.now() > battle.nextMood) {
            const wasCalm = battle.calm;
            battle.calm = Math.random() < 0.34;
            battle.nextMood = Date.now() + 650 + Math.random() * 450;
            if (wasCalm && !battle.calm) vibrate([45, 35, 45]);
          }
          let el = $("#battleFish");
          if (!battle.calm) {
            battle.x = 46 + Math.random() * 44;
            battle.y = 34 + Math.random() * 47;
            battle.frame = (battle.frame + 1) % 3;
          }
          el.style.left = battle.x + "%";
          el.style.top = battle.y + "%";
          el.style.backgroundPositionX = `${battle.frame * 50}%`;
          el.style.transform = battle.calm
            ? "translate(-50%,-50%) scale(.98)"
            : "translate(-50%,-50%) scale(1.04)";
          if (battle.reeling) {
            battle.hp -= (s.power / 11) * (battle.calm ? 1.8 : 0.7);
            battle.ten += (battle.calm ? 2 : 7) / control;
          } else battle.ten = Math.max(3, battle.ten - 5 * control);
          $("#battleMsg").textContent = battle.calm
            ? "糸が緩んだ！押して巻く好機！"
            : battle.reeling ? "魚が暴れている！危険なら指を離す！" : "竿を送り、テンションを逃がしている。";
          if (battle.hp <= 0) return caught();
          if (battle.ten >= 100) lose("糸が切れた……");
          drawBattle();
        }, 120);
      }
      function pull() {
        if (!battle) return;
        if (battle.phase === "prep") return beginFishing();
        if (battle.phase === "cast") {
          const distance = battle.cast;
          let f = pick();
          if (distance > 72 && Math.random() < .28) f = fish[Math.random() < .75 ? 2 : 3];
          battle.f = f; battle.hp = f.hp; battle.max = f.hp;
          battle.phase = "wait";
          battle.biteAt = Date.now() + (1500 + Math.random() * 2600) / baitData[s.selectedBait].bite;
          $("#castMeter").style.display = "none";
          $("#fishName").textContent = "水面を読む";
          $("#phaseLabel").textContent = distance > 67 ? " 深場" : distance > 34 ? " 中層" : " 岸際";
          $("#battleMsg").textContent = "小さな揺れは前アタリ。ウキが消し込むまで待つ。";
          $("#pull").innerHTML = "A<br><small>合わせる</small>";
          $("#wait").innerHTML = "B<br><small>竿を上げる</small>";
          return;
        }
        if (battle.phase === "wait") return lose("まだ前アタリだった。早合わせで逃げられた……。");
        if (battle.phase === "bite") startFight();
        if (battle.phase === "fight") battle.reeling = true;
      }
      function startFight() {
        battle.phase = "fight";
        const f = battle.f;
        $("#battleFish").style.opacity = "1";
        $("#battleFish").style.backgroundImage = `url("${fishAssets[f.id]}")`;
        $("#battleFish").style.backgroundPositionY = "0";
        $("#hp").parentElement.style.display = "block";
        $("#ten").parentElement.style.display = "block";
        $("#fishName").textContent = ["細い魚影","丸い魚影","大きな魚影","長い魚影","巨大な魚影"][f.shadowRow];
        $("#phaseLabel").textContent = " 水中戦";
        $("#pull").innerHTML = "A<br><small>押して巻く</small>";
        $("#wait").innerHTML = "B<br><small>糸を送る</small>";
        $("#battleMsg").textContent = "掛かった！Aを押して巻く、暴れたら離す！";
        log(`${f.name}が掛かった！`);
      }
      function wait() {
        if (!battle) return;
        if (battle.phase === "prep") {
          renderTackle();
          return open("tackle");
        }
        if (battle.phase !== "fight") return lose("竿を上げて仕掛けを回収した。");
        battle.reeling = false;
      }
      function drawBattle() {
        if (!battle || battle.phase !== "fight") return;
        $("#hp").style.width =
          Math.max(0, (battle.hp / battle.max) * 100) + "%";
        $("#ten").style.width = Math.min(100, battle.ten) + "%";
        const fx = battle.x * 10;
        const fy = battle.y * 5;
        $("#linePath").setAttribute(
          "d",
          battle.calm
            ? `M 150 48 Q 245 120 185 205 Q 260 300 ${fx} ${fy}`
            : `M 150 48 Q 280 155 ${fx} ${fy}`,
        );
        $("#linePath").style.strokeDasharray = battle.calm ? "9 5" : "none";
      }
      function lose(t) {
        log(t);
        endBattle();
      }
      function caught() {
        let f = battle.f;
        s.caught[f.id] = (s.caught[f.id] || 0) + 1;
        s.money += f.price;
        log(`${f.name}を釣り上げた！ ${f.price}円獲得。`);
        if (f.id === "nushi")
          alert(
            `🌟 星湖のヌシを釣り上げた！\n${dogName()}が誇らしげにしっぽを振った。`,
          );
        endBattle();
      }
      function endBattle() {
        clearInterval(timer);
        battle = null;
        $("#fishScene").classList.remove("active");
        render();
        armDogIdle();
      }
      function open(id) {
        $("#" + id).classList.add("open");
        renderRecord();
      }
      function close() {
        document
          .querySelectorAll(".modal.open")
          .forEach((x) => x.classList.remove("open"));
      }
      function renderRecord() {
        $("#book").innerHTML = fish
          .map(
            (f) =>
              `<div class="item"><b>${f.icon} ${f.name}</b><br>${s.caught[f.id] || 0}匹</div>`,
          )
          .join("");
        $("#log").innerHTML =
          s.log.map((x) => `<div class="item">${x}</div>`).join("") ||
          "まだ記録はない。";
      }
      $("#start").onclick = () => {
        $("#title").classList.remove("active");
        $("#game").classList.add("active");
        render();
        armDogIdle();
        log("星降る湖に着いた。Fableリクの釣りメモを開いた。");
      };
      document.querySelectorAll("[data-dog]").forEach((b) => {
        b.classList.toggle("active", b.dataset.dog === s.dog);
        b.onclick = () => {
          s.dog = b.dataset.dog;
          document
            .querySelectorAll("[data-dog]")
            .forEach((x) => x.classList.toggle("active", x === b));
          render();
          armDogIdle();
          save();
        };
      });
      document.querySelectorAll("[data-avatar]").forEach((b) => {
        b.classList.toggle("active", b.dataset.avatar === s.avatar);
        b.onclick = () => {
          s.avatar = b.dataset.avatar;
          document
            .querySelectorAll("[data-avatar]")
            .forEach((x) => x.classList.toggle("active", x === b));
          save();
        };
      });
      document.querySelectorAll("[data-move]").forEach((b) => {
        b.onpointerdown = () => move(b.dataset.move);
      });
      $("#action").onclick = action;
      $("#back").onclick = close;
      $("#menu").onclick = () => open("record");
      $("#pull").onpointerdown = (e) => {
        e.preventDefault();
        e.currentTarget.setPointerCapture?.(e.pointerId);
        pull();
      };
      $("#pull").onpointerup = () => { if (battle) battle.reeling = false; };
      $("#pull").onpointercancel = () => { if (battle) battle.reeling = false; };
      $("#wait").onclick = wait;
      $("#beginCast").onclick = beginFishing;
      document
        .querySelectorAll("[data-close]")
        .forEach((b) => (b.onclick = close));
      document.querySelectorAll("[data-buy-bait]").forEach(button => button.onclick = () => {
        const id = button.dataset.buyBait, item = baitData[id];
        if (s.money < item.price) return log("お金が足りない。");
        s.money -= item.price; s.baits[id] = (s.baits[id] || 0) + item.amount;
        log(`${item.name}を${item.amount}個買った。`); render();
      });
      document.querySelectorAll("[data-buy-rod]").forEach(button => button.onclick = () => {
        const id = button.dataset.buyRod;
        if (s.ownedRods.includes(id)) return log("もう持っている。");
        if (s.money < 1500) return log("お金が足りない。");
        s.money -= 1500; s.ownedRods.push(id); s.selectedRod = id;
        log(`${rodData[id].name}を買った！`); render();
      });
      addEventListener("keydown", (e) => {
        let m = {
          ArrowLeft: "left",
          ArrowRight: "right",
          ArrowUp: "up",
          ArrowDown: "down",
        }[e.key];
        if (m) move(m);
        if (e.key === "z" || e.key === "Enter") battle ? pull() : action();
        if (e.key === "x" || e.key === "Escape") battle ? wait() : close();
      });
      addEventListener("keyup", (e) => {
        if (battle && (e.key === "z" || e.key === "Enter")) battle.reeling = false;
      });
      $("#fishScene").addEventListener("contextmenu", e => e.preventDefault());
      setInterval(() => {
        dogAnimFrame++;
        if (dogWalking) drawDog();
      }, 170);
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      renderRecord();
    </script>
  </body>
</html>
