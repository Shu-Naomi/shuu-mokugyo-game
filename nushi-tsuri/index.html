<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ヌシ釣り 〜リクと川辺で〜</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16304d">
<style>
:root{--bg:#0e1d2b;--panel:#f3ead6;--ink:#223344;--accent:#2f6f8f;--accent2:#d79b4a;--line:#9ab0bd;--danger:#c65a4a;--good:#3e8f5b;}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#15314a,#0b1925);color:var(--ink);min-height:100vh;}
.wrap{max-width:480px;margin:0 auto;padding:12px 12px 24px;}
header{color:#fff;text-align:center;padding:12px 8px 8px} h1{font-size:1.45rem;margin:0} .sub{font-size:.86rem;opacity:.86;margin-top:4px}
.card{background:rgba(243,234,214,.96);border:2px solid #c9b88f;border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.river{position:relative;height:190px;border-radius:18px;overflow:hidden;background:linear-gradient(#8ed2ff 0 40%,#4aa0cf 40% 100%);border:3px solid #d8c79a;}
.river:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.45),transparent 20%),linear-gradient(90deg,rgba(255,255,255,.14),transparent 40%,rgba(255,255,255,.12));animation:flow 5s linear infinite;}
@keyframes flow{to{background-position:120px 0,0 0}}
.bank{position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(#8e6a3d,#5b3a20);border-top:4px solid #d7b66a}
.player{position:absolute;left:22px;bottom:42px;font-size:2.5rem;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}.dog{position:absolute;left:80px;bottom:40px;font-size:2rem}.float{position:absolute;width:14px;height:28px;border-radius:10px;background:linear-gradient(#fff 0 45%,#e33 45%);left:58%;top:48%;transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.fish{position:absolute;font-size:1.7rem;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));transition:transform .2s}.fish.shadow{opacity:.55;filter:brightness(.2) blur(.4px);}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.9rem}.pill{background:#fff8e8;border:1px solid #d2c29b;border-radius:999px;padding:7px 10px;font-weight:700}.wide{grid-column:1/-1}.bar{height:12px;background:#ddd;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--good),#8fcf6a);transition:.25s}.tension .fill{background:linear-gradient(90deg,#ffd36b,#d85a4a)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:14px;padding:12px 10px;background:linear-gradient(#ffe1a4,#d9983d);color:#35240b;font-weight:900;font-size:1rem;box-shadow:0 5px 0 #8c5a20}button:active{transform:translateY(3px);box-shadow:0 2px 0 #8c5a20}button.secondary{background:linear-gradient(#dcefff,#90c7e8);box-shadow:0 5px 0 #4f7892}button.danger{background:linear-gradient(#ffc3b8,#dd6d5b);box-shadow:0 5px 0 #9a3e35}
.log{max-height:120px;overflow:auto;font-size:.86rem;line-height:1.45}.log div{padding:4px 0;border-bottom:1px dashed #cab98f}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tabs button{font-size:.85rem;padding:9px 4px}.panel{display:none}.panel.active{display:block}.fishbook{display:grid;gap:6px}.fishrow{display:flex;justify-content:space-between;background:#fff8e8;border:1px solid #d2c29b;border-radius:12px;padding:8px;font-size:.9rem}.small{font-size:.82rem;color:#5b6b74}.titleline{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{background:#16304d;color:white;border-radius:999px;padding:4px 8px;font-size:.75rem}.ending{font-size:1.05rem;font-weight:900;text-align:center;color:#16304d}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🎣 ヌシ釣り 〜リクと川辺で〜</h1>
<div class="sub">Fableリクが遺した小さな釣りプロトタイプ</div>
</header>
<section class="card">
<div class="titleline"><b>星降る湖・浅瀬</b><span class="badge" id="timeLabel">朝</span></div>
<div class="river" id="river"><div class="fish shadow" id="fishShadow">🐟</div><div class="float" id="float"></div><div class="player">🧑‍🌾</div><div class="dog">🐕‍🦺</div><div class="bank"></div></div>
</section>
<section class="card status"><div class="pill">所持金 <span id="money">0</span>円</div><div class="pill">エサ <span id="bait">5</span>個</div><div class="pill">竿 <span id="rodName">竹の竿</span></div><div class="pill">釣果 <span id="caughtCount">0</span>匹</div><div class="wide"><b>魚の体力</b><div class="bar"><div class="fill" id="fishHp"></div></div></div><div class="wide tension"><b>糸テンション</b><div class="bar"><div class="fill" id="tension"></div></div></div><div class="wide small" id="hint">「仕掛けを投げる」で魚影を待とう。リクは静かに水面を見ている。</div></section>
<section class="card controls"><button id="castBtn">仕掛けを投げる</button><button id="pullBtn" class="secondary">引く</button><button id="waitBtn" class="secondary">待つ</button><button id="shopBtn">店へ行く</button></section>
<section class="card"><div class="tabs"><button data-tab="log" class="secondary">ログ</button><button data-tab="book" class="secondary">図鑑</button><button data-tab="shop" class="secondary">ショップ</button></div><div id="logPanel" class="panel active"><div class="log" id="log"></div></div><div id="bookPanel" class="panel"><div class="fishbook" id="book"></div></div><div id="shopPanel" class="panel"><p class="small">サミュエル・オールドマン「釣具は未来を引き寄せるんじゃよ」</p><button id="buyBait">エサ3個を買う（120円）</button><button id="buyRod" class="secondary">ホンモロコ竿を買う（1500円）</button></div></section>
<section class="card ending hidden" id="endingBox">🌟 湖のヌシを釣り上げた！<br>リクは静かにしっぽを振った。</section>
</div>
<script>
const fishList=[{id:'moroko',name:'ホンモロコ',price:90,hp:45,rare:0.45,emoji:'🐟'},{id:'funa',name:'フナ',price:130,hp:60,rare:0.32,emoji:'🐠'},{id:'koi',name:'コイ',price:240,hp:90,rare:0.18,emoji:'🐡'},{id:'nushi',name:'星湖のヌシ',price:1500,hp:180,rare:0.05,emoji:'🐋'}];
const state=JSON.parse(localStorage.getItem('nushi-riku-v1')||'{}');Object.assign(state,{money:state.money??300,bait:state.bait??5,rod:state.rod??'竹の竿',power:state.power??16,caught:state.caught??{},log:state.log??[]});let battle=null,time=0;const $=s=>document.querySelector(s);function save(){localStorage.setItem('nushi-riku-v1',JSON.stringify(state))}function addLog(t){state.log.unshift(t);state.log=state.log.slice(0,30);renderLog();save()}function pickFish(){const r=Math.random();let acc=0;for(const f of fishList){acc+=f.rare;if(r<=acc)return f}return fishList[0]}function render(){ $('#money').textContent=state.money;$('#bait').textContent=state.bait;$('#rodName').textContent=state.rod;$('#caughtCount').textContent=Object.values(state.caught).reduce((a,b)=>a+b,0);$('#fishHp').style.width=battle?Math.max(0,battle.hp/battle.maxHp*100)+'%':'0%';$('#tension').style.width=battle?battle.tension+'%':'0%';$('#timeLabel').textContent=['朝','昼','夕','夜'][time%4]; const fs=$('#fishShadow'); if(battle){fs.textContent=battle.fish.emoji;fs.style.left=battle.x+'%';fs.style.top=battle.y+'%'}else{fs.textContent='🐟';fs.style.left='70%';fs.style.top='58%'} renderBook();}
function renderLog(){const box=$('#log');box.innerHTML=state.log.map(x=>`<div>${x}</div>`).join('')||'<div>川辺は静かだ。</div>'}function renderBook(){const box=$('#book');box.innerHTML=fishList.map(f=>`<div class="fishrow"><span>${f.emoji} ${f.name}</span><span>${state.caught[f.id]||0}匹</span></div>`).join('')}function cast(){if(battle){addLog('まだ水中戦の途中だ。');return} if(state.bait<=0){addLog('エサがない。リクが足元を掘っている……');return} state.bait--; time++; const fish=pickFish(); battle={fish,hp:fish.hp,maxHp:fish.hp,tension:28,x:65+Math.random()*20,y:45+Math.random()*20,calm:false}; $('#hint').textContent=`${fish.name}の魚影！ 止まった瞬間に「引く」チャンス。`; addLog(`${fish.name}が食いついた！`); render()}function waitTurn(){if(!battle){addLog('水面を眺めた。リクも隣で待っている。');time++;render();return} battle.tension=Math.max(0,battle.tension-18); battle.calm=Math.random()<0.55; battle.x=45+Math.random()*35;battle.y=42+Math.random()*28; $('#hint').textContent=battle.calm?'魚が止まった！今なら引ける。':'魚が走っている。無理に引くと糸が危ない。'; render()}function pull(){if(!battle){addLog('まだ魚は掛かっていない。');return} if(battle.calm){battle.hp-=state.power+Math.floor(Math.random()*12);battle.tension+=18;addLog(`${battle.fish.name}を引いた！`)}else{battle.tension+=32;battle.hp-=Math.floor(state.power/3);addLog('魚が走っている時に引いた。糸が張る！')} battle.calm=false;if(battle.tension>=100){addLog('糸が切れた……。');battle=null;render();return} if(battle.hp<=0){catchFish();return} render()}function catchFish(){const f=battle.fish;state.caught[f.id]=(state.caught[f.id]||0)+1;state.money+=f.price;addLog(`${f.name}を釣り上げた！ ${f.price}円で売れた。`);if(f.id==='nushi')$('#endingBox').classList.remove('hidden');battle=null;save();render()}function shop(){document.querySelector('[data-tab="shop"]').click()}$('#castBtn').onclick=cast;$('#waitBtn').onclick=waitTurn;$('#pullBtn').onclick=pull;$('#shopBtn').onclick=shop;$('#buyBait').onclick=()=>{if(state.money<120){addLog('お金が足りない。');return}state.money-=120;state.bait+=3;addLog('エサを3個買った。');render();save()};$('#buyRod').onclick=()=>{if(state.rod==='ホンモロコ竿'){addLog('もう持っている。');return}if(state.money<1500){addLog('お金が足りない。');return}state.money-=1500;state.rod='ホンモロコ竿';state.power=30;addLog('ホンモロコ竿を買った！小さな魚も大きな未来も釣れる。');render();save()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$('#'+b.dataset.tab+'Panel').classList.add('active')});if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}render();renderLog();addLog('星降る湖に着いた。Fableリクの釣りメモが風に揺れている。');
</script>
</body></html>
