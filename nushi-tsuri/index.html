<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#10283a" />
    <title>ぬし釣り犬小屋・星降る湖</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        --ink: #172a35;
        --cream: #fff1c7;
        --gold: #eab75d;
        --blue: #256b8e;
      }
      * {
        box-sizing: border-box;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07131d;
        color: var(--ink);
        font-family: system-ui, "Yu Gothic", sans-serif;
      }
      button {
        font: inherit;
        font-weight: 900;
        border: 2px solid #5d3b22;
        border-radius: 10px;
        color: #352312;
        background: linear-gradient(#fff0b4, #d99a43);
        box-shadow: 0 4px 0 #6c4025;
      }
      button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #6c4025;
      }
      .screen {
        display: none;
        width: 100%;
        height: 100%;
      }
      .screen.active {
        display: grid;
      }
      .pixel {
        image-rendering: pixelated;
      }
      .title {
        place-items: center;
        background:
          linear-gradient(#071825aa, #071825ee),
          radial-gradient(circle at 70% 15%, #fff7bd 0 2%, transparent 3%),
          linear-gradient(#193d58, #6da2aa 58%, #172d25 59%);
        color: #fff;
        text-align: center;
      }
      .title-box {
        width: min(88vw, 720px);
        padding: 4vh 5vw;
        border: 4px double #f4cf78;
        background: #10283add;
        box-shadow:
          0 0 0 5px #271b19,
          0 14px 35px #0008;
      }
      .title h1 {
        margin: 0;
        color: #ffe99d;
        font-size: clamp(1.8rem, 6vw, 4rem);
        text-shadow: 4px 4px #552b26;
      }
      .title p {
        margin: 0.7em;
      }
      .title button {
        padding: 12px 42px;
        font-size: 1.1rem;
      }
      .game {
        grid-template-rows: auto 1fr;
        background: #10283a;
      }
      .hud {
        display: flex;
        gap: 7px;
        align-items: center;
        padding: max(4px, env(safe-area-inset-top)) 8px 5px;
        color: #fff;
        background: #172434;
        border-bottom: 2px solid #d7ad5a;
        font-size: clamp(0.67rem, 1.7vw, 0.9rem);
      }
      .hud span {
        padding: 4px 8px;
        border: 1px solid #ffffff2c;
        border-radius: 7px;
        background: #ffffff10;
      }
      .hud .grow {
        flex: 1;
      }
      .world {
        position: relative;
        min-height: 0;
        overflow: hidden;
        background: #69a056;
      }
      .map {
        position: absolute;
        inset: 0 auto 0 0;
        width: 300%;
        overflow: hidden;
        background: #69a056;
        transition: transform 0.36s linear;
      }
      .lake {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 57%;
        background: repeating-linear-gradient(
          0deg,
          #277ea1 0 5px,
          #318caf 6px 10px
        );
        animation: water 3s linear infinite;
      }
      .shore {
        position: absolute;
        inset: 54% 0 0;
        background: linear-gradient(#d5b36b 0 10%, #6d9b50 11%);
        border-top: 5px solid #f0d080;
      }
      .dock {
        position: absolute;
        left: 42%;
        top: 35%;
        width: 19%;
        height: 42%;
        background: repeating-linear-gradient(
          90deg,
          #805128 0 13px,
          #a66b32 14px 25px
        );
        border: 4px solid #55361f;
      }
      .shop {
        position: absolute;
        left: 84%;
        bottom: 16%;
        width: 18%;
        height: 32%;
        min-width: 88px;
        background: #a75a38;
        border: 5px solid #552f24;
      }
      .shop:before {
        content: "釣具店";
        position: absolute;
        inset: -23px 5% auto;
        background: #f4d27c;
        border: 3px solid #57351f;
        text-align: center;
        font-weight: 900;
      }
      .shop:after {
        content: "🏮";
        position: absolute;
        right: -16px;
        top: 15%;
      }
      .trees {
        position: absolute;
        left: 2%;
        bottom: 6%;
        font-size: clamp(2rem, 7vw, 5rem);
        letter-spacing: -0.5em;
        filter: drop-shadow(3px 5px #294a2c);
      }
      .building {
        position: absolute;
        bottom: 15%;
        width: 8%;
        height: 29%;
        border: 4px solid #523426;
        background: linear-gradient(#be6c48 0 68%, #8b4c38 69%);
        box-shadow:
          inset 0 -12px #623725,
          5px 6px #0003;
      }
      .building::before {
        content: attr(data-name);
        position: absolute;
        inset: -22px 4% auto;
        padding: 2px;
        border: 2px solid #563721;
        background: #f1d080;
        text-align: center;
        font-size: clamp(0.55rem, 1.4vw, 0.78rem);
        font-weight: 900;
      }
      .building::after {
        content: "";
        position: absolute;
        left: 38%;
        bottom: 0;
        width: 25%;
        height: 48%;
        background: #472d24;
        border: 2px solid #241917;
      }
      .house-a {
        left: 7%;
      }
      .house-b {
        left: 18%;
        background: linear-gradient(#587f87 0 68%, #3e5d67 69%);
      }
      .diner {
        left: 54%;
        width: 10%;
        background: linear-gradient(#d47d3e 0 68%, #9f4d2f 69%);
      }
      .market {
        left: 66%;
        width: 11%;
        background: linear-gradient(#658d58 0 68%, #45683f 69%);
      }
      .mystery {
        left: 78%;
        width: 7%;
        filter: brightness(0.65);
      }
      .rescue-spot {
        position: absolute;
        left: 31%;
        bottom: 14%;
        width: 5%;
        height: 8%;
        border-radius: 50%;
        background: #79502f;
        box-shadow: inset 0 5px #4f3324;
      }
      .player {
        position: absolute;
        width: 46px;
        height: 58px;
        transform: translate(-50%, -50%);
        background-size: 300% 100%;
        background-position: 0 50%;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        z-index: 5;
        transition: left 0.36s linear, top 0.36s linear;
        will-change: left, top;
      }
      .player.boy {
        background-image: url("assets/player-boy.png");
      }
      .player.girl {
        background-image: url("assets/player-girl.png");
      }
      .player > .player-sprite {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
        image-rendering: pixelated;
      }
      .player:not(.companion-pet):not(.companion-sit) {
        background-image: none;
      }
      .player.face-side {
        background-position-x: 50%;
      }
      /* The standing sheets overlap their middle cell by a few source pixels.
         Clip only the empty display edges so neighbouring poses cannot appear
         as floating specks; linked companion poses use separate artwork. */
      .player.boy.face-side:not(.companion-pet):not(.companion-sit) {
        clip-path: inset(0 0 0 3px);
      }
      .player.girl.face-side:not(.companion-pet):not(.companion-sit) {
        clip-path: inset(0 3px);
      }
      .player.face-up {
        background-position-x: 100%;
      }
      .player.boy.face-right,
      .player.girl.face-left {
        transform: translate(-50%, -50%) scaleX(-1);
      }
      .player.walking {
        animation: player-step 0.36s steps(4, end) infinite;
      }
      .player.companion-pet {
        background-size: 200% 100%;
        background-position: 0 50%;
        transform-origin: center bottom;
        /* Keep the complete owner sprite fixed.  Moving the arm by swapping
           frames made the small in-game body appear to rock back and forth. */
        animation: none;
      }
      .player.boy.companion-pet {
        background-image: url("assets/player-boy-pet-v18.svg");
      }
      .player.girl.companion-pet {
        background-image: url("assets/player-girl-pet-v18.svg");
      }
      .player.companion-pet.face-left {
        transform: translate(-50%, -50%);
      }
      .player.companion-pet.face-right {
        transform: translate(-50%, -50%) scaleX(-1);
      }
      /* Every pose shares the standing sprite's shoe contact point. */
      .player.boy.companion-pet.face-left {
        margin-left: -4px;
        margin-top: -1px;
      }
      .player.boy.companion-pet.face-right {
        margin-left: 4px;
        margin-top: -1px;
      }
      .player.girl.companion-pet {
        margin-top: -2px;
      }
      .player.companion-pet::before,
      .player.companion-pet::after {
        display: none !important;
      }
      .player.companion-pet > .player-sprite,
      .player.companion-sit > .player-sprite {
        display: none;
      }
      .pet-scene {
        position: absolute;
        display: none;
        width: 80px;
        height: 64px;
        transform: translate(-50%, -50%);
        image-rendering: pixelated;
        pointer-events: none;
        z-index: 7;
      }
      .pet-scene canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .pet-scene.active { display: block; }
      .pet-scene.dog-right { transform: translate(-50%, -50%) scaleX(-1); }
      .pet-scene::after {
        content: "♡";
        position: absolute;
        left: 38%;
        top: -9px;
        color: #ff8fa8;
        font-size: 16px;
        text-shadow: 1px 1px #fff;
      }
      .player.companion-sit {
        background-size: 100% 100%;
        background-position: center;
        transform-origin: center bottom;
        animation: none;
      }
      .player.boy.companion-sit {
        background-image: url("assets/player-boy-sit.png?v=16");
      }
      .player.girl.companion-sit {
        background-image: url("assets/player-girl-sit.png?v=16");
      }
      .player.companion-sit.face-left {
        transform: translate(-50%, -50%);
      }
      .player.companion-sit.face-right {
        transform: translate(-50%, -50%) scaleX(-1);
      }
      @keyframes player-step {
        25%,
        75% {
          margin-top: -1px;
        }
      }
      .player:before {
        content: "";
        position: absolute;
        left: 8px;
        top: 0;
        width: 18px;
        height: 17px;
        background: #f1c39a;
        border: 3px solid #432c25;
        box-shadow: 0 17px 0 4px #284d68;
      }
      .player:after {
        content: "";
        position: absolute;
        left: 3px;
        top: -5px;
        width: 28px;
        height: 9px;
        background: #3c2b26;
        border: 2px solid #231a18;
      }
      .player.boy::before,
      .player.boy::after,
      .player.girl::before,
      .player.girl::after {
        display: none;
      }
      .companion {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 42px;
        height: 38px;
        display: grid;
        place-items: center;
        font-size: 25px;
        z-index: 4;
        image-rendering: pixelated;
        background-repeat: no-repeat;
        transition: left 0.62s ease-in-out, top 0.62s ease-in-out;
        will-change: left, top;
      }
      .companion.canvas-dog {
        /* The dog assets are now pre-cached; avoid drawing a second sprite
           underneath Canvas (Riku's differently sized sheet exposed it). */
        background-image: none !important;
        background-color: transparent;
      }
      .companion canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        pointer-events: none;
        transform-origin: center bottom;
      }
      .companion.face-player-right canvas {
        transform: scaleX(-1);
      }
      /* The new connected arm belongs to the owner sprite and should pass
         naturally over the dog's head instead of becoming a detached hand. */
      .companion.petting {
        z-index: 4;
      }
      .companion.shuu {
        background-image: url("assets/shuu-walk.png?v=12");
      }
      .companion.grey {
        background-image: url("assets/grey-walk.png?v=12");
      }
      .companion.shuu,
      .companion.grey,
      .companion.riku {
        background-size: 400% 300%;
        color: transparent;
      }
      .companion.riku {
        background-image: url("assets/riku-walk.png?v=12");
      }
      .companion.dir-down {
        background-position: 0 50%;
      }
      .companion.dir-left {
        background-position: 33.333% 50%;
      }
      .companion.dir-right {
        background-position: 66.667% 50%;
      }
      .companion.dir-up {
        background-position: 100% 50%;
      }
      .companion.walking {
        animation: dog-step 0.3s steps(1) infinite;
      }
      .companion.walking canvas {
        animation: none;
      }
      .companion.idle-sit,
      .companion.idle-sleep,
      .companion.idle-dig,
      .companion.idle-beg {
        background-image: url("assets/dog-idles.png?v=12");
        background-size: 400% 300%;
      }
      .companion.shuu[class*="idle-"] { background-position-y: 0; }
      .companion.riku[class*="idle-"] { background-position-y: 50%; }
      .companion.grey[class*="idle-"] { background-position-y: 100%; }
      .companion.idle-sit { background-position-x: 0; }
      .companion.idle-sleep {
        background-position-x: 33.333%;
        /* The visible paws rest at roughly 76% of the element height.  Breathe
           around that line so the sleeping dog never floats above the grass. */
        transform-origin: center 76%;
        animation: dog-breathe 2.4s ease-in-out infinite;
      }
      .companion.idle-dig {
        background-position-x: 66.667%;
        animation: none;
      }
      /* The canvas redraws two actual forepaw positions.  Keep the body
         planted here; moving the whole dog looked like sniffing the soil. */
      .companion.idle-dig canvas { animation: none; }
      .companion.idle-dig::before {
        content: "";
        position: absolute;
        left: 2px;
        bottom: 1px;
        width: 15px;
        height: 4px;
        border-radius: 50%;
        background: #6f431f;
        box-shadow: inset 0 1px #a66a2e;
        opacity: .9;
        animation: dog-dig-soil .48s steps(2) infinite;
        z-index: 7;
      }
      .companion.idle-dig::after {
        content: "";
        position: absolute;
        left: 9px;
        bottom: 7px;
        width: 3px;
        height: 3px;
        background: #9a5e27;
        box-shadow: -5px -2px #6f431f, 5px -5px #bd7a35;
        image-rendering: pixelated;
        animation: dog-dig-dirt .48s steps(3, jump-none) infinite;
        z-index: 8;
      }
      .companion.idle-beg { background-position-x: 100%; animation: dog-beg .8s ease-in-out infinite; }
      .companion.idle-beg::after {
        content: "♡";
        position: absolute;
        left: 50%;
        top: -22px;
        transform: translateX(-50%);
        color: #ff8fa8;
        font-size: 16px;
        text-shadow: 1px 1px #fff;
      }
      @keyframes dog-step {
        0% {
          background-position-y: 0;
        }
        50% {
          background-position-y: 100%;
        }
        100% {
          background-position-y: 0;
        }
      }
      @keyframes dog-paws {
        50% { transform: translateY(-1px); }
      }
      @keyframes dog-breathe {
        50% { transform: translate(-50%, -50%) scale(1.018, .985); }
      }
      @keyframes dog-dig-soil {
        50% { transform: scaleX(1.18); filter: brightness(1.08); }
      }
      @keyframes dog-dig-dirt {
        0% { transform: translate(0, 2px); opacity: 0; }
        35% { opacity: 1; }
        100% { transform: translate(-8px, -7px); opacity: 0; }
      }
      @keyframes dog-beg {
        50% { transform: translate(-50%, -53%); }
      }
      .sam {
        position: absolute;
        left: 4%;
        bottom: 1%;
        width: 52px;
        height: 70px;
        z-index: 20;
        background: url("assets/sam-front.png") center bottom / contain no-repeat;
        image-rendering: pixelated;
      }
      .sam::before {
        content: none;
      }
      .sam::after {
        content: "サム";
        position: absolute;
        left: 50%;
        top: -13px;
        transform: translateX(-50%);
        color: #fff1a5;
        font: 900 9px monospace;
        text-shadow: 1px 1px #000;
      }
      .hint {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        z-index: 8;
        max-width: 74%;
        padding: 5px 10px;
        border: 2px solid #f1ce73;
        border-radius: 8px;
        background: #102033dc;
        color: #fff;
        font-size: clamp(0.7rem, 1.7vw, 0.9rem);
        text-align: center;
      }
      .controls {
        position: absolute;
        inset: auto 0 7px;
        z-index: 10;
        pointer-events: none;
      }
      .dpad {
        position: absolute;
        left: 14px;
        bottom: 0;
        width: 128px;
        height: 96px;
      }
      .dpad button,
      .actions button {
        position: absolute;
        pointer-events: auto;
        width: 43px;
        height: 43px;
        padding: 0;
        border-radius: 8px;
        background: #27364ddb;
        color: #fff;
        border-color: #cbb274;
        box-shadow: 0 3px 0 #111;
      }
      .up {
        left: 43px;
      }
      .down {
        left: 43px;
        top: 48px;
      }
      .left {
        top: 48px;
      }
      .right {
        left: 86px;
        top: 48px;
      }
      .actions {
        position: absolute;
        right: 16px;
        bottom: 0;
        width: 130px;
        height: 90px;
      }
      .actions button {
        border-radius: 50%;
        font-size: 1rem;
      }
      .a {
        right: 0;
        top: 2px;
        background: #b9343f !important;
      }
      .b {
        left: 16px;
        top: 42px;
        background: #346a9a !important;
      }
      .modal {
        display: none;
        position: absolute;
        z-index: 30;
        inset: 6%;
        padding: 10px;
        border: 4px double #f2cd70;
        border-radius: 12px;
        background: #132238f5;
        color: #fff;
        overflow: auto;
      }
      .modal.open {
        display: block;
      }
      .modal h2 {
        margin: 0 0 8px;
        color: #ffe69a;
      }
      .modal .close {
        float: right;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }
      .item {
        padding: 8px;
        border: 1px solid #ffffff28;
        border-radius: 8px;
        background: #ffffff0c;
      }
      .fish-scene {
        display: none;
        position: absolute;
        z-index: 20;
        inset: 0;
        overflow: hidden;
        isolation: isolate;
        background-color: #073f5d;
        background-image: url("assets/lake-underwater-v25.svg");
        background-position: 50% 50%;
        background-size: 106% 106%;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        transition: background-position 0.55s ease-out;
      }
      .fish-scene.active {
        display: block;
      }
      .fish-scene::before {
        content: "";
        position: absolute;
        z-index: 0;
        inset: -12% -18%;
        pointer-events: none;
        opacity: 0.28;
        background: repeating-linear-gradient(
          103deg,
          transparent 0 10%,
          #c8ffff20 11% 14%,
          transparent 15% 25%
        );
        transform: translateX(-4%);
        animation: underwater-light 8s ease-in-out infinite alternate;
      }
      .fish-scene::after {
        content: "";
        position: absolute;
        z-index: 5;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 54% 42%, transparent 22%, #021d3270 100%),
          linear-gradient(transparent 55%, #031a2e45);
        transition: background 0.45s;
      }
      .fish-scene.nushi-fight::after {
        background:
          radial-gradient(ellipse at 54% 42%, transparent 12%, #10092a99 100%),
          linear-gradient(#17264b25, #09071eaa);
      }
      .fish-scene.water-rush::before {
        opacity: 0.5;
        animation-duration: 0.55s;
      }
      .fish-scene.hook-reveal::after {
        animation: hook-reveal-water 0.78s steps(6);
      }
      .surface {
        position: absolute;
        z-index: 1;
        inset: 0 0 auto;
        height: 12%;
        opacity: 0.42;
        background: repeating-linear-gradient(
          0deg,
          #e3ffff80 0 2px,
          transparent 3px 7px
        );
        animation: water-surface 2.4s linear infinite;
      }
      .fisher {
        display: none;
      }
      .line {
        position: absolute;
        left: 18%;
        top: 12%;
        width: 2px;
        height: 54%;
        background: #e8f4ed;
        transform-origin: top;
      }
      .line-svg {
        position: absolute;
        z-index: 2;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .line-svg path {
        fill: none;
        stroke: #d9ece7;
        stroke-width: 1.55;
        stroke-linecap: round;
        opacity: 0.58;
        vector-effect: non-scaling-stroke;
        filter: drop-shadow(1px 1px 0 #06304c88);
        transition: 0.22s;
      }
      .line-svg path.slack {
        stroke-dasharray: 7 8;
        opacity: 0.38;
      }
      .line-svg path.warn {
        stroke: #f7cf78;
        stroke-width: 1.8;
        opacity: 0.72;
      }
      .line-svg path.danger {
        stroke: #ff807b;
        stroke-width: 2.05;
        opacity: 0.88;
        filter: drop-shadow(0 0 2px #ff3d45aa);
        animation: line-quiver 0.18s steps(2) infinite;
      }
      .fish-tackle {
        display: none;
        position: absolute;
        width: 18px;
        height: 14px;
        transform-origin: 0 50%;
        pointer-events: none;
        opacity: 0.86;
        transition:
          left 0.12s linear,
          top 0.12s linear,
          transform 0.12s linear;
        will-change: left, top, transform;
      }
      .fish-tackle-back {
        z-index: 2;
        filter: drop-shadow(1px 1px 0 #03213588);
      }
      .fish-tackle-front {
        z-index: 4;

      .fish-scene.fighting .fish-tackle-front .bait-shape {

      .water-fx {

        z-index: 2;
        inset: 0;
        width: 100%;
        height: 100%;

        image-rendering: pixelated;
      }
      .surface-splash {
        display: none;
        position: absolute;
        z-index: 6;
        left: 12%;
        top: 11%;
        width: 190px;
        height: 105px;
        transform: translate(-50%, -50%) scale(var(--splash-scale, 1));
        pointer-events: none;
      }
      .surface-splash.show {
        display: block;
      }
      .surface-splash::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 66%;
        width: 12px;
        height: 7px;
        transform: translate(-50%, -50%);
        border: 4px solid #eaffff;
        border-top: 0;
        box-shadow: 0 0 10px #8ff5ff;
        opacity: 0;

      .surface-splash.show::after {
        animation: splash-foam 0.9s steps(6) both;

      .surface-splash i {
        --dx: 0px;
        --dy: -45px;
        --delay: 0ms;
        position: absolute;
        left: 50%;
        top: 65%;
        width: 8px;
        height: 8px;
        border: 2px solid #eaffff;
        background: #8fefff;
        box-shadow: 0 0 7px #b9ffff;
        opacity: 0;
      }
      .surface-splash.show i {
        animation: splash-drop 0.82s steps(6) var(--delay) both;
      }
      .surface-splash i:nth-child(1) { --dx: -82px; --dy: -28px; --delay: 0ms; }
      .surface-splash i:nth-child(2) { --dx: -65px; --dy: -57px; --delay: 20ms; }
      .surface-splash i:nth-child(3) { --dx: -45px; --dy: -76px; --delay: 45ms; }
      .surface-splash i:nth-child(4) { --dx: -20px; --dy: -88px; --delay: 10ms; }
      .surface-splash i:nth-child(5) { --dx: 7px; --dy: -94px; --delay: 35ms; }
      .surface-splash i:nth-child(6) { --dx: 34px; --dy: -82px; --delay: 55ms; }
      .surface-splash i:nth-child(7) { --dx: 59px; --dy: -64px; --delay: 15ms; }
      .surface-splash i:nth-child(8) { --dx: 82px; --dy: -35px; --delay: 50ms; }
      .surface-splash i:nth-child(9) { --dx: -91px; --dy: -8px; --delay: 75ms; }
      .surface-splash i:nth-child(10) { --dx: 92px; --dy: -10px; --delay: 80ms; }
      .surface-splash i:nth-child(11) { --dx: -31px; --dy: -53px; --delay: 95ms; }
      .surface-splash i:nth-child(12) { --dx: 45px; --dy: -46px; --delay: 100ms; }
      .battle-fish {

      .battle-fish.fish-funa {

      }

        width: clamp(125px, 21vw, 235px);

      }
      .battle-fish.fish-nushi {
        width: clamp(165px, 26vw, 310px);
        aspect-ratio: 48 / 35;
      }

      }
      .battle-fish.gill-wash {
        z-index: 6;
        transition:
          left 0.1s linear,
          top 0.1s linear,
          transform 0.1s linear,
          filter 0.1s;
        filter:
          brightness(1.24)
          saturate(1.24)

          drop-shadow(7px 8px 2px #02192dcc);
      }
      .fish-scene.gill-wash .surface {
        height: 18%;
        opacity: 0.78;
        animation-duration: 0.48s;
      }
      .battle-fish.landing {
        transition:
          left 0.72s cubic-bezier(.2,.9,.25,1),
          top 0.72s cubic-bezier(.2,.9,.25,1),
          transform 0.72s cubic-bezier(.2,1.25,.3,1),
          opacity 0.72s;
        filter:
          brightness(1.2)
          saturate(1.18)
          contrast(1.05)
          drop-shadow(0 0 12px #d7ffff)
          drop-shadow(6px 7px 2px #02192dcc);

      .dog-select {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin: 9px 0;
      }
      .dog-select button {
        padding: 7px 12px;
        font-size: 0.82rem;
      }
      .dog-select button.active {
        outline: 3px solid #fff3a0;
      }
      .avatar-select {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin: 7px 0;
      }
      .avatar-select button {
        padding: 6px 14px;
        font-size: 0.82rem;
      }
      .avatar-select button.active {
        outline: 3px solid #91e6ff;
      }
      .battle-ui {
        position: absolute;
        z-index: 7;
        top: auto;
        bottom: 4%;
        left: 3%;
        width: 34%;
        padding: 7px;
        border: 2px solid #f2ce76;
        background: #071a2bd9;
        color: #fff;
        border-radius: 8px;
        backdrop-filter: blur(2px);
      }
      .battle-ui.warn { box-shadow: 0 0 0 2px #f2b84b88; }
      .battle-ui.danger {
        border-color: #ff706d;
        box-shadow: 0 0 12px #ff3d45bb;
        animation: danger-pulse .42s steps(2) infinite;
      }
      .meter {
        height: 12px;
        margin: 4px 0 8px;
        background: #09131f;
        border: 1px solid #fff5;
        border-radius: 9px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0;
        background: #65d47d;
        transition: 0.2s;
      }
      .tension {
        background: #e0b34e;
      }
      .distance {
        background: linear-gradient(90deg, #56d6ef, #99f4d8);
      }
      #distanceLabel {
        display: none;
        color: #bff7ff;
      }
      .tension.warn { background: #f08b39; }
      .tension.danger { background: #f04449; }
      .battle-msg {
        min-height: 2.7em;
        font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      }
      .battle-actions {

        z-index: 7;

      }
      .battle-actions button {
        width: 96px;
        height: 64px;
        touch-action: none;
      }
      .cast-meter {
        position: relative;
        height: 18px;
        margin: 7px 0;
        overflow: hidden;
        border: 2px solid #fff;
        background: linear-gradient(90deg,#bde7a6 0 33%,#f7df78 34% 67%,#efa09b 68%);
      }
      .cast-marker {
        position: absolute;
        left: 0;
        width: 5px;
        height: 100%;
        background: #142033;
        transform: translateX(-50%);
      }
      .tackle-options { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
      .tackle-options button.selected { outline:3px solid #69d8ff; }
      .catch-card {
        display: none;
        position: absolute;
        z-index: 45;
        inset: 0;
        min-width: 0;
        padding: clamp(8px, 2vh, 16px) clamp(16px, 4vw, 44px);
        border: 0;
        border-top: 3px double #ffe38a;
        border-bottom: 3px double #ffe38a;
        background:
          radial-gradient(circle at 30% 45%, #267e9c88, transparent 33%),
          linear-gradient(135deg, #071827f7, #102f49f7 55%, #071827f7);
        color: #fff;
        text-align: center;
        pointer-events: auto;
        overflow: hidden;
        box-shadow:
          inset 0 0 42px #68ddff26,
          0 10px 30px #0009;
      }
      .catch-card.show {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(155px, .75fr);
        align-items: center;
        gap: clamp(10px, 3vw, 36px);
        animation: catch-screen-in .42s ease-out both;
      }
      .catch-card.legend {
        border-color: #ffd65a;
        background:
          radial-gradient(circle at 31% 45%, #7d5bc780, transparent 37%),
          linear-gradient(135deg, #100d27fa, #281d4bfa 55%, #100d27fa);
        box-shadow:
          inset 0 0 52px #ffd65a2e,
          0 10px 30px #0009;
      }
      .catch-showcase {
        position: relative;
        min-width: 0;
        height: clamp(165px, 52vh, 280px);
        overflow: visible;
      }
      .catch-showcase::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 3%;
        width: min(72%, 330px);
        height: 13%;
        transform: translateX(-50%);
        border-radius: 50%;
        background: #0007;
        filter: blur(7px);
      }
      .catch-rig {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: -8%;
        width: 1px;
        height: 112%;
        transform: translateX(-50%);
        transform-origin: 50% 0;
        animation: catch-rig-swing 1.18s ease-in-out infinite alternate;
      }
      .catch-line {
        position: absolute;
        z-index: 1;
        left: 0;
        top: 0;
        width: 1px;
        height: 25%;
        background: linear-gradient(#d9f6ffcc, #c7e7ee88);
        box-shadow: 0 0 3px #d9fbff99;
      }
      .catch-hook {
        position: absolute;
        z-index: 4;
        left: -2px;
        top: calc(25% - 4px);
        width: 9px;
        height: 11px;
        border: 2px solid #d9e4e6;
        border-top: 0;
        border-left: 0;
        border-radius: 0 0 8px 7px;
        transform-origin: 2px 2px;
        animation: catch-hook-twitch .72s ease-in-out infinite alternate;
      }
      .catch-fish-turn {
        position: absolute;
        z-index: 3;

        top: 25%;

        transform: rotate(-90deg);
        transform-origin: 0 0;
        animation: catch-fish-dangle .86s ease-in-out infinite alternate;
      }
      .catch-fish {
        position: absolute;
        left: 0;
        top: 0;
        width: clamp(105px, min(19vw, 36vh), 190px);

        transform-origin: 90% 56%;

        background-size: 800% 100%;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        filter:
          brightness(1.14)
          saturate(1.13)

      }
      .catch-fish.fish-moroko {
        width: clamp(90px, min(17vw, 34vh), 160px);
        aspect-ratio: 128 / 55;
        transform: translate(-95.8%, -60%);
        transform-origin: 95.8% 60%;
      }
      .catch-fish.fish-funa {
        width: clamp(100px, min(19vw, 38vh), 185px);
        aspect-ratio: 144 / 95;
        transform: translate(-86.8%, -57.5%);
        transform-origin: 86.8% 57.5%;
      }
      .catch-fish.fish-koi {
        width: clamp(120px, min(23vw, 42vh), 220px);
        aspect-ratio: 28 / 15;
        transform: translate(-89.7%, -58%);
        transform-origin: 89.7% 58%;
      }
      .catch-fish.fish-nushi {
        width: clamp(145px, min(28vw, 46vh), 260px);

      .landscape-warning {

      }

      @keyframes line-quiver {

      }

      }
      @keyframes hooked-reveal {
        0% {
          opacity: 0;
          filter:
            brightness(0.08)

            drop-shadow(0 0 3px #b8f7ff)

        }
        20% {
          opacity: 1;
          filter:
            brightness(0.18)
            saturate(0)
            contrast(1.8)
            drop-shadow(0 0 7px #c6fbff)
            drop-shadow(5px 6px 2px #02192dbb);
        }
        48% {
          opacity: 1;
          filter:
            brightness(1.72)
            saturate(0.18)
            contrast(1.35)
            drop-shadow(0 0 16px #f2ffff)
            drop-shadow(5px 6px 2px #02192dbb);
        }
        72% {

            brightness(var(--fish-light, 1))

            drop-shadow(0 0 7px #b8f7ff)
            drop-shadow(5px 6px 2px #02192dbb);
        }
        100% {
          opacity: 1;
          filter:
            brightness(var(--fish-light, 1))
            saturate(var(--fish-color, 1))
            contrast(var(--fish-contrast, 1))
            drop-shadow(5px 6px 2px #02192dbb);
        }
      }
      @keyframes hook-reveal-water {

        24% { opacity: 0.82; }
        48% { opacity: 0.18; }
        68% { opacity: 0.7; }

      @keyframes splash-drop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(.45); }

        }

        }
      }

    <div class="landscape-warning">
      📱 スマホを横向きにしてね<br />星降る湖が広がるよ
    </div>
    <section id="title" class="screen title active">
      <div class="title-box">
        <small>犬小屋釣行記</small>
        <h1>ぬし釣り犬小屋</h1>
        <h2>星降る湖</h2>
        <p>Fableリクの釣りメモを手に、湖のヌシを追え。</p>
        <div class="avatar-select" aria-label="主人公を選ぶ">
          <button data-avatar="boy">🧢 男の子</button>
          <button data-avatar="girl">🧢 女の子</button>
        </div>
        <div class="dog-select" aria-label="同行するワンコ">
          <button data-dog="shuu">🐕 シュウ</button>
          <button data-dog="riku">🐕‍🦺 リク</button>
          <button data-dog="grey">🐕 Grey</button>
        </div>
        <button id="start">湖へ行く</button>
      </div>
    </section>
    <section id="game" class="screen game">
      <header class="hud">

        ><span>💰 <b id="money">300</b>円</span
        ><span>🪱 <b id="bait">5</b></span
        ><span class="grow">🎣 <b id="rod">竹の竿</b></span
        ><button id="menu">記録</button>
      </header>
      <main class="world" id="world">
        <div class="map" id="map">
          <div class="lake"></div>
          <div class="shore"></div>
          <div class="dock"></div>
          <div class="shop"><div class="sam" aria-label="サミュエル・オールドマン"></div></div>
          <div class="building house-a" data-name="湖畔の民家"></div>
          <div class="building house-b" data-name="釣り宿"></div>
          <div class="building diner" data-name="ワカサギ食堂"></div>
          <div class="building market" data-name="魚市場"></div>
          <div class="building mystery" data-name="閉じた小屋"></div>
          <div class="rescue-spot" aria-label="エサ採集ポイント"></div>
          <div class="trees">🌲🌲🌲</div>

          <div class="dpad">
            <button class="up" data-move="up">▲</button
            ><button class="left" data-move="left">◀</button
            ><button class="down" data-move="down">▼</button
            ><button class="right" data-move="right">▶</button>
          </div>
          <div class="actions">
            <button class="a" id="action">A</button
            ><button class="b" id="back">B</button>
          </div>
        </div>

        const canvas = $("#playerSprite");
        const linkedIdle = ["idle-beg", "idle-sleep"].includes(dogIdleMode);
        const walking =
          playerWalking && !companionReaction && !linkedIdle;
        const direction = ["left", "right"].includes(s.direction)
          ? "side"
          : s.direction === "up" ? "up" : "down";
        const walkImage = playerWalkImages?.[s.avatar];
        // The front- and rear-facing standing cells both have a deliberately
        // broad boot stance. Flashing either one between strides reads as
        // bow-legged, so hold each real straight-on stride for two beats.
        // Side movement keeps the four-beat gait from v36.
        const phase = playerAnimFrame % 4;
        const straightWalk = walking && direction !== "side";
        const strideFrame =
          walking && (straightWalk || phase % 2 === 0);
        const useWalkImage =
          strideFrame && walkImage?.complete && walkImage.naturalWidth;
        const image = useWalkImage ? walkImage : playerImages?.[s.avatar];
        if (!canvas || !image?.complete || !image.naturalWidth) return;
        const ctx = canvas.getContext("2d");
        const width = canvas.width;
        const height = canvas.height;
        const column = { down: 0, side: 1, up: 2 }[direction];
        const cellWidth = image.naturalWidth / 3;
        const cellHeight = useWalkImage
          ? image.naturalHeight / 2
          : image.naturalHeight;
        const sourceX = column * cellWidth;
        const sourceY = useWalkImage
          ? (

        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(
          image,
          sourceX,
          sourceY,
          cellWidth,
          cellHeight,
          0,
          0,
          width,
          height,
        );

        scene.classList.remove(
          "nushi-fight",
          "water-rush",
          "fighting",
          "landing",
          "gill-wash",
          "hook-reveal",
        );
        scene.style.backgroundPosition = "50% 50%";
        $("#linePath").setAttribute("d", "M 150 48 Q 245 145 650 275");
        for (const id of ["#fishTackleBack", "#fishTackleFront"]) {
          const tackle = $(id);
          tackle.className =
            `fish-tackle ${id.endsWith("Back") ? "fish-tackle-back" : "fish-tackle-front"}`;
          tackle.style.removeProperty("left");
          tackle.style.removeProperty("top");
          tackle.style.removeProperty("transform");
        }
        fishElement.className = "battle-fish";
        fishElement.style.removeProperty("--fish-light");
        fishElement.style.removeProperty("--fish-color");
        fishElement.style.removeProperty("--fish-contrast");
        fishElement.style.removeProperty("left");
        fishElement.style.removeProperty("top");
        fishElement.style.removeProperty("transition");
        fishElement.style.opacity = "0";
        fishElement.style.transform = "translate(-50%,-50%)";
        $("#distanceLabel").style.display = "none";
        $("#surfaceSplash").classList.remove("show");
        $("#surfaceSplash").style.removeProperty("--splash-scale");
        for (const id of ["#ten", "#battleUi", "#linePath"])
          $(id).classList.remove("warn", "danger", "slack");
      }
      function hideCatchCard() {
        clearTimeout(catchTimer);
        $("#catchCard").classList.remove("show", "legend");
      }
      function showCatchCard(f, first) {
        const card = $("#catchCard");
        const hangingFish = $("#catchFish");
        $("#catchBadge").textContent = f.id === "nushi" ? "🌟 LEGEND!" : "🎣 GET!";
        $("#catchTitle").textContent = f.name;
        const detail = first
          ? `初釣果！ ＋${f.price}円`
          : `${s.caught[f.id]}匹目 ・ ＋${f.price}円`;
        $("#catchDetail").textContent =
          f.id === "nushi" ? `${detail} ・ ${dogName()}もしっぽぶんぶん！` : detail;
        hangingFish.className = `catch-fish fish-${f.id}`;
        hangingFish.style.backgroundImage = `url("${fishAssets[f.id]}")`;
        hangingFish.style.backgroundPositionX = "0";
        card.classList.remove("show", "legend");
        void card.offsetWidth;
        card.classList.toggle("legend", f.id === "nushi");
        card.classList.add("show");
        vibrate(f.id === "nushi" ? [80, 45, 80, 45, 180] : [70, 40, 120]);
        catchTimer = setTimeout(hideCatchCard, 5200);
      }
      function renderBattleFish() {
        const element = $("#battleFish");
        element.style.left = battle.x + "%";
        element.style.top = battle.y + "%";
        element.style.backgroundPositionX =
          `${(battle.frame || 0) * (100 / 7)}%`;
        const offsetX = Number(battle.visualOffsetX || 0).toFixed(2);
        const offsetY = Number(battle.visualOffsetY || 0).toFixed(2);
        const facing = battle.facing || 1;
        const stretch = battle.bodyStretch || 1;
        const squash = battle.bodySquash || 1;
        element.style.transform =
          `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) ` +
          `rotate(${battle.renderAngle || 0}deg) ` +
          `scaleX(${facing * stretch}) scaleY(${squash}) ` +
          `scale(${battle.renderScale || 1})`;
        const depthLight = clampBattle(
          1.11 - (battle.y - 28) * 0.006,
          0.73,
          1.08,
        );
        const depth = clampBattle(
          (battle.y - (battle.surfaceY || 14)) /
            (82 - (battle.surfaceY || 14)),
          0,
          1,
        );
        const depthColor = clampBattle(
          0.68 + (1 - depth) * 0.32 + (battle.retrieval || 0) * 0.08,
          0.62,
          1.08,
        );
        const depthContrast = 1.02 + depth * 0.12;
        element.style.setProperty("--fish-light", depthLight.toFixed(2));
        element.style.setProperty("--fish-color", depthColor.toFixed(2));
        element.style.setProperty(
          "--fish-contrast",
          depthContrast.toFixed(2),
        );
      }
      function battleMouthAndHook() {
        const scene = $("#fishScene");
        const fishElement = $("#battleFish");
        const profile = fishMouthProfiles[battle.f.id];
        const sceneWidth = Math.max(1, scene.clientWidth);
        const sceneHeight = Math.max(1, scene.clientHeight);
        const facing = battle.facing || 1;
        const scale = battle.renderScale || 1;
        const angle = battle.renderAngle || 0;
        const radians = angle * Math.PI / 180;
        const cos = Math.cos(radians);
        const sin = Math.sin(radians);

        // Work in physical CSS pixels while rotating so the anchor follows
        // the exact responsive sprite size, then convert to the line SVG's
        // deliberately stretched 1000 x 500 coordinate space.
        const localMouthX =
          profile.x * fishElement.offsetWidth * scale *
          (battle.bodyStretch || 1) * facing;
        const localMouthY =
          profile.y * fishElement.offsetHeight * scale *
          (battle.bodySquash || 1);
        const rotatedMouthX = localMouthX * cos - localMouthY * sin;
        const rotatedMouthY = localMouthX * sin + localMouthY * cos;
        const lipX = clampBattle(
          battle.x * 10 +
            (rotatedMouthX + Number(battle.visualOffsetX || 0)) *
              1000 / sceneWidth,
          20,
          990,
        );
        const lipY = clampBattle(
          battle.y * 5 +
            (rotatedMouthY + Number(battle.visualOffsetY || 0)) *
              500 / sceneHeight,
          48,
          490,
        );

        const outwardX = facing * cos;
        const outwardY = facing * sin;
        const downX = -sin;
        const downY = cos;
        const rootX = clampBattle(
          lipX + (-outwardX * profile.inset + downX * profile.drop) *
            1000 / sceneWidth,
          20,
          990,
        );
        const rootY = clampBattle(
          lipY + (-outwardY * profile.inset + downY * profile.drop) *
            500 / sceneHeight,
          48,
          490,
        );

        // The shank lives behind the fish and begins just inside the lower
        // lip.  The long line ends at its tiny eye; the front layer shows only
        // the small bend and bait below the jaw.
        const hookEyeX = 8 * profile.tackleScale * facing;
        const hookEyeY = -4 * profile.tackleScale;
        const rotatedEyeX = hookEyeX * cos - hookEyeY * sin;
        const rotatedEyeY = hookEyeX * sin + hookEyeY * cos;
        const lineX = clampBattle(
          rootX + rotatedEyeX * 1000 / sceneWidth,
          20,
          995,
        );
        const lineY = clampBattle(
          rootY + rotatedEyeY * 500 / sceneHeight,
          45,
          495,
        );
        return { rootX, rootY, lineX, lineY, facing, angle, profile };
      }
      function drawFishTackle(anchor) {
        const bait = battle.bait || s.selectedBait || "worm";
        for (const [id, layer] of [
          ["#fishTackleBack", "fish-tackle-back"],
          ["#fishTackleFront", "fish-tackle-front"],
        ]) {
          const tackle = $(id);
          tackle.className = `fish-tackle ${layer} bait-${bait}`;
          tackle.style.left = `${anchor.rootX / 10}%`;
          tackle.style.top = `calc(${anchor.rootY / 5}% - 7px)`;
          tackle.style.transform =
            `rotate(${anchor.angle}deg) scaleX(${anchor.facing}) ` +
            `scale(${anchor.profile.tackleScale})`;
        }
      }
      function battleTick() {
        clearInterval(timer);
        timer = setInterval(() => {
          if (!battle) return;
          if (battle.phase !== "fight") updateWaterFx();
          if (battle.phase === "cast") {
            battle.cast += battle.castDir * 3;
            if (battle.cast >= 100 || battle.cast <= 0) battle.castDir *= -1;
            $("#castMarker").style.left = `${battle.cast}%`;
            return;
          }
          if (battle.phase === "wait") {
            const now = Date.now();
            if (now >= battle.biteAt && now <= battle.biteAt + 1050) {
              battle.phase = "bite";
              vibrate([90, 55, 170]);
              $("#battleMsg").textContent = "消し込んだ！！今だ、Aで合わせる！";
              $("#pull").innerHTML = "A<br><small>合わせる！</small>";
            }
            return;
          }
          if (battle.phase === "bite") {
            if (Date.now() > battle.biteAt + 1050) lose("合わせが遅れた……魚はエサだけ持っていった。");
            return;
          }
          if (battle.phase !== "fight") return;
          const control = rodData[s.selectedRod].control;
          if (!battle.mood || Date.now() > battle.nextMood) chooseFishMood();
          const mood = battle.mood;
          if (battle.gillWash) {
            updateGillWash(control);
            updateWaterFx();
            renderBattleFish();
            drawBattle();
            if (battle.ten >= 100) return lose("エラ洗いで糸が切れた……");
            return;
          }
          updateRetrieval(mood);
          moveBattleFish(mood);
          updateWaterFx();
          renderBattleFish();
          if (battle.reeling) {
            battle.ten += mood.tension / control;
          } else {
            battle.ten = Math.max(3, battle.ten - mood.release * control);
          }
          battle.ten = Math.min(110, battle.ten);
          const warning =
            battle.ten >= 85
              ? "⚠ 糸が切れそう！ "
              : battle.ten >= 65
                ? "！テンション高め。 "
                : "";
          const fishTakingLine =
            !battle.reeling && battle.retrievalDelta < -0.001
              ? "魚に糸を奪われる！ "
              : "";
          if (battle.gillRecovery > 0) {
            battle.gillRecovery--;
            $("#battleMsg").textContent = battle.recoveryMessage;
          } else {
            $("#battleMsg").textContent =
              warning + fishTakingLine + (battle.reeling ? mood.hold : mood.loose);
          }
          drawBattle();
          const arrival = Math.hypot(
            battle.x - battle.surfaceX,
            battle.y - battle.surfaceY,
          );
          const landingRadius = battle.f.id === "nushi" ? 11 : 7;
          if (battle.retrieval >= 0.999 && arrival <= landingRadius)
            return surfaceCatch();
          if (battle.ten >= 100) return lose("糸が切れた……");
        }, 120);
      }
      function pull() {
        if (!battle) return;
        if (battle.phase === "prep") return beginFishing();
        if (battle.phase === "cast") {
          const distance = battle.cast;
          let f = pick();
          if (distance > 72 && Math.random() < .28) f = fish[Math.random() < .75 ? 2 : 3];
          battle.f = f;
          battle.x = clampBattle(54 + distance * 0.4, 54, f.id === "nushi" ? 90 : 94);
          battle.y = clampBattle(44 + distance * 0.18, 44, f.id === "nushi" ? 66 : 72);
          battle.startX = battle.x;
          battle.startY = battle.y;
          battle.surfaceX = 12;
          battle.surfaceY = 14;
          battle.retrieval = 0;
          battle.castDistance = distance;
          battle.startMeters = Math.max(6, Math.round(7 + distance * 0.26));
          battle.distanceFactor = clampBattle(battle.startMeters / 18, 0.75, 1.55);
          battle.phase = "wait";
          battle.biteAt = Date.now() + (1500 + Math.random() * 2600) / baitData[s.selectedBait].bite;
          $("#linePath").setAttribute(
            "d",
            `M 150 48 Q 275 135 ${battle.x * 10} ${battle.y * 5}`,
          );
          $("#castMeter").style.display = "none";
          $("#fishName").textContent = "水面を読む";
          $("#phaseLabel").textContent = distance > 67 ? " 深場" : distance > 34 ? " 中層" : " 岸際";
          $("#battleMsg").textContent = "小さな揺れは前アタリ。ウキが消し込むまで待つ。";
          $("#pull").innerHTML = "A<br><small>合わせる</small>";
          $("#wait").innerHTML = "B<br><small>竿を上げる</small>";
          return;
        }
        if (battle.phase === "wait") return lose("まだ前アタリだった。早合わせで逃げられた……。");
        if (battle.phase === "bite") startFight();
        if (battle.phase === "fight") battle.reeling = true;
      }
      function startFight() {
        battle.phase = "fight";
        const f = battle.f;
        battle.calmBoost = s.calmBonus > 0 ? 3 : 0;
        if (s.calmBonus > 0) {
          s.calmBonus = 0;
          save();
        }
        battle.mood = null;
        battle.nextMood = 0;
        battle.retrieval = 0;
        battle.tensionBand = "safe";
        battle.frame = 0;
        battle.swimPhase = 0;
        battle.tailStroke = 0;
        battle.tailKick = false;
        battle.bodyStretch = 1;
        battle.bodySquash = 1;
        battle.visualOffsetX = 0;
        battle.visualOffsetY = 0;
        battle.turnIntent = battle.facing || 1;
        battle.turnHold = 0;
        const scene = $("#fishScene");
        scene.classList.add("fighting", "hook-reveal");
        scene.classList.toggle("nushi-fight", f.id === "nushi");
        const fishElement = $("#battleFish");
        fishElement.className = `battle-fish fish-${f.id}`;
        fishElement.style.backgroundImage = `url("${fishAssets[f.id]}")`;
        fishElement.style.backgroundPositionY = "0";
        fishElement.style.transition = "none";
        fishElement.style.opacity = "0";
        $("#fishTackleBack").className =
          `fish-tackle fish-tackle-back bait-${battle.bait || s.selectedBait}`;
        $("#fishTackleFront").className =
          `fish-tackle fish-tackle-front bait-${battle.bait || s.selectedBait}`;
        renderBattleFish();
        void fishElement.offsetWidth;
        fishElement.style.removeProperty("transition");
        $("#distanceLabel").style.display = "inline";
        $("#distanceMeter").parentElement.style.display = "block";
        $("#ten").parentElement.style.display = "block";
        $("#fishName").textContent = f.name;
        $("#pull").innerHTML = "A<br><small>押して巻く</small>";
        $("#wait").innerHTML = "B<br><small>糸を送る</small>";
        chooseFishMood(true);
        fishElement.classList.add("hooked");
        fishElement.style.opacity = "1";
        $("#battleMsg").textContent =
          `${f.name}が姿を現した！右の深場から左の水面まで巻き上げよう。${fightProfiles[f.id].intro}`;
        drawBattle();
        log(`${f.name}が掛かった！`);
      }
      function wait() {
        if (!battle) return;
        if (battle.phase === "prep") {
          renderTackle();
          return open("tackle");
        }
        if (battle.phase === "landing") return;
        if (battle.phase !== "fight") return lose("竿を上げて仕掛けを回収した。");
        battle.reeling = false;
      }
      function drawBattle() {
        if (!battle || battle.phase !== "fight") return;
        const remaining = Math.max(0, 1 - (battle.retrieval || 0));
        $("#distanceMeter").style.width = remaining * 100 + "%";
        const meters = Math.max(0, Math.ceil((battle.startMeters || 0) * remaining));
        $("#distanceLabel").textContent = `左の水面まで ${meters}m`;
        $("#ten").style.width = Math.min(100, battle.ten) + "%";
        const anchor = battleMouthAndHook();
        const linePath = $("#linePath");
        linePath.setAttribute(
          "d",
          battle.calm
            ? `M 150 48 Q 250 118 190 205 Q 270 310 ${anchor.lineX} ${anchor.lineY}`
            : `M 150 48 Q 285 150 ${anchor.lineX} ${anchor.lineY}`,
        );
        linePath.classList.toggle("slack", battle.calm);
        drawFishTackle(anchor);
        $("#fishScene").style.backgroundPosition =
          `${50 - (battle.x - 68) * 0.09}% ${50 - (battle.y - 55) * 0.07}%`;
        updateTensionFeedback();
      }
      function showSurfaceSplash(
        x = battle.surfaceX || 12,
        y = battle.surfaceY || 14,
        intensity = 1,
      ) {
        const goalX = x * 10;
        const goalY = y * 5;
        const count = Math.round(38 + 14 * intensity);
        for (let i = 0; i < count; i++) {
          waterFxState.bubbles.push({
            x: goalX + (Math.random() - 0.5) * (125 + 20 * intensity),
            y: goalY + 8 + Math.random() * 28,
            vx: (Math.random() - 0.5) * (6 + intensity),
            vy: -3 - Math.random() * (4 + intensity),
            size: 4 + Math.floor(Math.random() * (6 + intensity)),
            life: 20 + Math.floor(Math.random() * 16),
          });
        }
        const splash = $("#surfaceSplash");
        splash.style.left = `${x}%`;
        splash.style.top = `${Math.max(9, y - 2)}%`;
        splash.style.setProperty("--splash-scale", intensity.toFixed(2));
        splash.classList.remove("show");
        void splash.offsetWidth;
        splash.classList.add("show");
        drawWaterFx();
      }
      function surfaceCatch() {
        if (!battle || battle.phase !== "fight") return;
        battle.phase = "landing";
        battle.reeling = false;
        clearTimeout(landingTimer);
        const scene = $("#fishScene");
        scene.classList.remove("water-rush", "fighting", "gill-wash");
        scene.classList.add("landing");
        const fishElement = $("#battleFish");
        fishElement.classList.remove("burst");
        fishElement.classList.add("landing");
        fishElement.style.left = `${battle.surfaceX}%`;
        fishElement.style.top = "7%";
        fishElement.style.transform =
          `translate(-50%,-50%) rotate(${battle.facing < 0 ? 14 : -14}deg) ` +
          `scaleX(${battle.facing || 1}) scale(1.08)`;
        $("#phaseLabel").textContent = " ✦ 水面到達";
        $("#distanceLabel").textContent = "左の水面まで 0m";
        $("#distanceMeter").style.width = "0%";
        $("#battleMsg").textContent = "左の水面まで巻き上げた！釣り上げ成功！";
        $("#linePath").setAttribute(
          "d",
          `M 150 48 Q 162 42 ${battle.surfaceX * 10} ${battle.surfaceY * 5}`,
        );
        showSurfaceSplash();
        vibrate([80, 35, 80, 35, 150]);
        landingTimer = setTimeout(() => {
          if (battle?.phase === "landing") caught();
        }, 1100);
      }
      function lose(t) {
        log(t);
        endBattle();
      }
      function caught() {
        const f = battle.f;
        const first = !s.caught[f.id];
        s.caught[f.id] = (s.caught[f.id] || 0) + 1;
        s.money += f.price;
        log(`${f.name}を釣り上げた！ ${f.price}円獲得。`);
        endBattle();
        showCatchCard(f, first);
      }
      function endBattle() {
        clearInterval(timer);
        clearTimeout(landingTimer);
        landingTimer = 0;
        battle = null;
        resetBattleFeedback();
        clearWaterFx();
        $("#fishScene").classList.remove("active");
        render();
        armDogIdle();
      }
      function open(id) {
        $("#" + id).classList.add("open");
        renderRecord();
      }
      function close() {
        document
          .querySelectorAll(".modal.open")
          .forEach((x) => x.classList.remove("open"));
      }
      function renderRecord() {
        $("#book").innerHTML = fish
          .map(
            (f) =>
              `<div class="item"><b>${f.icon} ${f.name}</b><br>${s.caught[f.id] || 0}匹</div>`,
          )
          .join("");
        $("#log").innerHTML =
          s.log.map((x) => `<div class="item">${x}</div>`).join("") ||
          "まだ記録はない。";
      }
      $("#start").onclick = () => {
        $("#title").classList.remove("active");
        $("#game").classList.add("active");
        render();
        armDogIdle();
        log("星降る湖に着いた。Fableリクの釣りメモを開いた。");
      };
      document.querySelectorAll("[data-dog]").forEach((b) => {
        b.classList.toggle("active", b.dataset.dog === s.dog);
        b.onclick = () => {
          s.dog = b.dataset.dog;
          document
            .querySelectorAll("[data-dog]")
            .forEach((x) => x.classList.toggle("active", x === b));
          render();
          armDogIdle();
          save();
        };
      });
      document.querySelectorAll("[data-avatar]").forEach((b) => {
        b.classList.toggle("active", b.dataset.avatar === s.avatar);
        b.onclick = () => {
          s.avatar = b.dataset.avatar;
          document
            .querySelectorAll("[data-avatar]")
            .forEach((x) => x.classList.toggle("active", x === b));
          save();
        };
      });
      document.querySelectorAll("[data-move]").forEach((b) => {
        const stopMoving = () => {
          clearInterval(moveHoldInterval);
          moveHoldInterval = 0;
        };
        b.onpointerdown = (e) => {
          e.preventDefault();
          e.currentTarget.setPointerCapture?.(e.pointerId);
          stopMoving();
          move(b.dataset.move);
          moveHoldInterval = setInterval(() => move(b.dataset.move), 360);
        };
        b.onpointerup = stopMoving;
        b.onpointercancel = stopMoving;
        b.onlostpointercapture = stopMoving;
      });
      $("#catchClose").onclick = hideCatchCard;
      $("#action").onclick = action;
      $("#back").onclick = close;
      $("#menu").onclick = () => open("record");
      $("#pull").onpointerdown = (e) => {
        e.preventDefault();
        e.currentTarget.setPointerCapture?.(e.pointerId);
        pull();
      };
      $("#pull").onpointerup = () => { if (battle) battle.reeling = false; };
      $("#pull").onpointercancel = () => { if (battle) battle.reeling = false; };
      $("#wait").onclick = wait;
      $("#beginCast").onclick = beginFishing;
      document
        .querySelectorAll("[data-close]")
        .forEach((b) => (b.onclick = close));
      document.querySelectorAll("[data-buy-bait]").forEach(button => button.onclick = () => {
        const id = button.dataset.buyBait, item = baitData[id];
        if (s.money < item.price) return log("お金が足りない。");
        s.money -= item.price; s.baits[id] = (s.baits[id] || 0) + item.amount;
        log(`${item.name}を${item.amount}個買った。`); render();
      });
      document.querySelectorAll("[data-buy-rod]").forEach(button => button.onclick = () => {
        const id = button.dataset.buyRod;
        if (s.ownedRods.includes(id)) return log("もう持っている。");
        if (s.money < 1500) return log("お金が足りない。");
        s.money -= 1500; s.ownedRods.push(id); s.selectedRod = id;
        log(`${rodData[id].name}を買った！`); render();
      });
      addEventListener("keydown", (e) => {
        if ($("#catchCard").classList.contains("show")) {
          if (["z", "x", "Enter", "Escape"].includes(e.key))
            hideCatchCard();
          e.preventDefault();
          return;
        }
        let m = {
          ArrowLeft: "left",
          ArrowRight: "right",
          ArrowUp: "up",
          ArrowDown: "down",
        }[e.key];
        if (m) move(m);
        if (e.key === "z" || e.key === "Enter") battle ? pull() : action();
        if (e.key === "x" || e.key === "Escape") battle ? wait() : close();
      });
      addEventListener("keyup", (e) => {
        if (battle && (e.key === "z" || e.key === "Enter")) battle.reeling = false;
      });
      $("#fishScene").addEventListener("contextmenu", e => e.preventDefault());
      setInterval(() => {
        dogAnimFrame++;
        if (dogWalking || dogIdleMode === "idle-dig") drawDog();
      }, 170);
      setInterval(advancePetSceneFrame, 60);
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      renderRecord();
    </script>
  </body>
</html>
